<!doctype html>
<html lang="ru" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>alaqai — слайды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<script defer src="../vendor/katex/katex.min.js"></script>
<script defer src="../vendor/katex/contrib/mhchem.min.js"></script>
<script defer src="../vendor/qrcode.js"></script>
<style>
:root{
  --bg:#E9E9E4; --slide:#FAFAF7; --paper:#FFFFFF;
  --ink:#0B0B0C; --ink2:#3C3C42; --muted:#7C7C83;
  --line:#E3E3DD; --line2:#CDCDC6; --hover:#F1F1EC;
  --acc:#2563EB; --acc-ink:#FFFFFF; --acc-soft:#EAF1FF; --acc-line:#C7D7FE; --acc-dk:#8AB4FF; --mark:#C9DAFF; --acc2:#F59E0B;
  --ok:#1F9D4C; --ok-soft:#E1F7E8; --bad:#E5484D; --bad-soft:#FFE6E6;
  --blue:#2F6BFF;
  --f-head:"TikTok Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bar:72px;
}
:root[data-theme="green"]{--acc:#15803D;--acc-ink:#FFFFFF;--acc-soft:#E8F6EC;--acc-line:#BDE6C9;--acc-dk:#6EE7A0;--mark:#BFEFCD;--acc2:#2563EB}
:root[data-theme="violet"]{--acc:#7C3AED;--acc-ink:#FFFFFF;--acc-soft:#F2ECFE;--acc-line:#DCCBFD;--acc-dk:#C4A7FF;--mark:#E2D4FF;--acc2:#F59E0B}
:root[data-theme="orange"]{--acc:#C2410C;--acc-ink:#FFFFFF;--acc-soft:#FFF1E8;--acc-line:#FED7BE;--acc-dk:#FDBA74;--mark:#FFD9BF;--acc2:#2563EB}
:root[data-theme="teal"]{--acc:#0F766E;--acc-ink:#FFFFFF;--acc-soft:#E6F6F4;--acc-line:#B5E3DE;--acc-dk:#5EEAD4;--mark:#BDEDE7;--acc2:#F59E0B}
:root[data-theme="lime"]{--acc:#D6FF3B;--acc-ink:#0B0B0C;--acc-soft:#F2FFC7;--acc-line:#E2F59A;--acc-dk:#D6FF3B;--mark:#D6FF3B;--acc2:#2F6BFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:24px;height:24px;flex:none}
[hidden]{display:none!important}

/* ---------- stage ---------- */
#viewport{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:var(--slide);overflow:hidden;transform-origin:50% 50%}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:52px 80px 44px;opacity:0;visibility:hidden;transform:translateX(32px);transition:opacity .32s ease,transform .32s ease,visibility 0s linear .32s}
.slide.before{transform:translateX(-32px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .32s ease,transform .32s ease,visibility 0s}
.slide.full{padding:0}
.no-anim .slide{transition:none!important}
.err{margin:auto;font:600 28px var(--f-body);color:var(--bad)}

/* ---------- common ---------- */
.s-top{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:56px;margin-bottom:20px}
.tag{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px 0 18px;border-radius:999px;border:1.5px solid var(--line2);background:var(--paper);font:600 26px var(--f-body);white-space:nowrap}
.tag svg{width:28px;height:28px}
.tag.game{background:var(--ink);border-color:var(--ink);color:#fff}
.tag.game svg{color:var(--acc-dk)}
.hint{font:500 26px/1.3 var(--f-body);color:var(--muted);text-align:right;max-width:780px}
.write{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font:600 26px var(--f-body)}
.write svg{width:28px;height:28px}
.s-title{font:800 68px/1.08 var(--f-head);letter-spacing:-.022em;margin-bottom:24px;max-width:1440px;text-wrap:balance}
.game .s-title{font-size:60px;margin-bottom:22px}
mark{background:none;color:inherit;box-shadow:inset 0 -.36em 0 var(--mark);padding:0 .05em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lbl{font:700 22px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.n{flex:none;width:56px;height:56px;border-radius:14px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:700 30px var(--f-head)}
.n.dot{border-radius:50%}
.katex{font-size:1.08em}
.step .katex,.answer .katex,.dano .katex{font-size:1.18em}
.tex-fb{font-family:"Times New Roman",Georgia,serif;font-style:italic}
.remember{margin-top:auto;display:flex;gap:18px;align-items:center;padding:22px 28px;border-radius:20px;background:var(--acc-soft);border:1.5px solid var(--acc-line);font:400 32px/1.4 var(--f-body)}
.remember svg{width:40px;height:40px;color:var(--acc)}

.btn{height:72px;padding:0 30px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font:600 28px var(--f-body);border:1.5px solid var(--line2);background:var(--paper);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn svg{width:30px;height:30px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary svg{color:var(--acc-dk)}
.btn.primary:hover{background:#222226}
.btn.sq{width:72px;padding:0}
.btn.lg{height:84px;padding:0 42px;font-size:32px;border-radius:22px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.35;pointer-events:none}
.g-foot{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:22px}
.g-status{margin-left:auto;font:700 34px var(--f-head)}
.g-status.ok{color:var(--ok)} .g-status.bad{color:var(--bad)}

/* ---------- title ---------- */
.tpl-title{flex-direction:row}
.tt-l{flex:1.5;display:flex;flex-direction:column;padding:72px 80px 60px 96px}
.pill{align-self:flex-start;display:inline-flex;align-items:center;height:60px;padding:0 28px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font:600 28px var(--f-body)}
.tt-l h1{font:800 100px/1.0 var(--f-head);letter-spacing:-.035em;margin-top:auto;text-wrap:balance}
.tt-l .sub{font:400 36px/1.35 var(--f-body);color:var(--ink2);margin-top:28px;max-width:820px}
.tt-meta{display:flex;gap:28px;margin-top:auto;padding-top:40px;font:500 28px var(--f-body);color:var(--muted)}
.tt-r{flex:1;position:relative;overflow:hidden;background:var(--ink);color:#fff;padding:72px 56px;display:flex;flex-direction:column;justify-content:center}
.tt-r .lbl{color:var(--acc-dk);margin-bottom:34px;position:relative;z-index:1}
.tt-r ol{list-style:none;display:flex;flex-direction:column;gap:26px;position:relative;z-index:1}
.tt-r li{display:flex;gap:22px;align-items:center;font:500 34px/1.28 var(--f-body)}
.tt-r .n{background:var(--acc);color:var(--acc-ink)}
.tt-r::before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;border:2px solid #26262B;right:-170px;top:-170px}
.tt-r::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#17171A;right:-70px;bottom:-100px}

/* ---------- notes ---------- */
.def{font:500 44px/1.36 var(--f-body);background:var(--paper);border:1.5px solid var(--line);border-left:10px solid var(--ink);border-radius:0 22px 22px 0;padding:24px 36px}
.def b{font-weight:700}
.points{list-style:none;display:grid;grid-template-columns:1fr;gap:24px 52px;margin:30px 0 24px}
.points.two{grid-template-columns:1fr 1fr}
.points li{display:flex;gap:20px;align-items:flex-start;font:400 36px/1.38 var(--f-body)}
.points li .n{margin-top:-3px}

/* ---------- figure ---------- */
.fig{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:48px}
.fig-t{display:flex;flex-direction:column;min-height:0}
.fig-t .s-title{font-size:58px;margin-bottom:14px}
.lead{font:400 31px/1.38 var(--f-body);color:var(--ink2);margin-bottom:24px}
.legend{list-style:none;display:flex;flex-direction:column;gap:18px}
.legend li{display:flex;gap:18px;align-items:flex-start}
.legend b{display:block;font:700 35px/1.2 var(--f-head)}
.legend .tx{display:block;font:400 28px/1.32 var(--f-body);color:var(--ink2);margin-top:4px}
.fig-img{margin:0;background:var(--paper);border:1.5px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;min-height:0}
.fig-img .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.fig-img .art svg,.fig-img .art img{width:100%;height:100%;object-fit:contain;display:block;border-radius:14px}
.fig-img figcaption{font:500 24px/1.35 var(--f-body);color:var(--muted);margin-top:14px;text-align:center}

/* ---------- formula ---------- */
.f-lead{font:400 33px/1.38 var(--f-body);color:var(--ink2);margin:-10px 0 24px;max-width:1440px}
.f-wrap{display:flex;gap:24px;margin-bottom:24px;height:266px}
.f-main{flex:1;min-height:0;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:92px;padding:16px}
.f-side{width:400px;display:flex;flex-direction:column;gap:12px;min-height:0}
.f-chip{flex:1;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;font-size:44px;padding:4px;min-height:0;overflow:hidden}
.f-legend{display:grid;gap:20px}
.f-item{display:flex;gap:18px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:16px 20px}
.f-item .sym{flex:none;width:88px;height:88px;border-radius:20px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:48px}
.f-item .nm{font:700 32px/1.18 var(--f-head)}
.f-item .un{font:500 27px/1.3 var(--f-body);color:var(--ink2);margin-top:6px}
.tpl-formula .remember{margin-top:24px}

/* ---------- example ---------- */
.ex{flex:1;min-height:0;display:grid;grid-template-columns:640px 1fr;gap:48px}
.ex-l{display:flex;flex-direction:column;gap:30px}
.ex-task{font:500 36px/1.4 var(--f-body);background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:26px 30px}
.dano{align-self:flex-start;border-right:3px solid var(--ink);padding:2px 44px 6px 4px}
.dano .g{font:400 38px/1.5 var(--f-body)}
.dano .lbl{margin-bottom:8px}
.dano .sep{border-top:3px solid var(--ink);margin:14px -44px 14px -4px}
.ex-r{display:flex;flex-direction:column;min-height:0}
.steps{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.step{display:flex;gap:20px;align-items:center;min-height:92px;padding:10px 22px;border-radius:20px;background:var(--paper);border:1.5px solid var(--line);font:400 36px/1.3 var(--f-body)}
.step:not(.show){background:transparent;border-style:dashed;border-color:var(--line2)}
.step:not(.show)>span:last-child{visibility:hidden}
.step:not(.show) .n{background:transparent;color:var(--line2);border:2px dashed var(--line2)}
.step.show{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}
.answer{margin-top:16px;display:flex;align-items:center;gap:18px;min-height:92px;padding:10px 26px;border-radius:20px;background:var(--acc);color:var(--acc-ink);font:700 40px var(--f-head);visibility:hidden}
.answer.show{visibility:visible;animation:pop .35s ease}

/* ---------- chips / drag ---------- */
.chip{display:inline-flex;align-items:center;justify-content:center;height:68px;padding:0 26px;border-radius:16px;background:var(--paper);border:2.5px solid var(--ink);color:var(--ink);font:500 34px var(--f-body);white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s,opacity .15s}
.chip:hover{background:var(--hover)}
.chip.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.dragging{opacity:.25}
.chip.ok{background:var(--ok-soft);border-color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.ghost{background:var(--acc)!important;color:var(--acc-ink)!important;border-color:var(--acc)!important;cursor:grabbing}
.bank{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;min-height:100px;padding:14px;border-radius:22px;border:2px dashed var(--line2);transition:border-color .15s,background .15s}
.bank.over{border-color:var(--ink);background:var(--acc-soft)}

/* fill */
.fill-text{font:400 40px/2.05 var(--f-body);background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:22px 36px;margin-bottom:20px}
.slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:220px;height:72px;margin:0 6px;border-radius:16px;border:2.5px dashed var(--line2);background:#FCFCFA;transition:border-color .15s,background .15s}
.slot .chip{height:66px}
.slot.filled{border-color:transparent;background:transparent}
.slot.over,.picking .slot:not(.filled):hover{border-color:var(--ink);background:var(--acc-soft)}

/* sort */
.sort{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.buckets{flex:1;min-height:0;display:grid;gap:24px}
.bucket{display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px 20px;min-height:0;transition:border-color .15s,background .15s}
.bucket h3{display:flex;align-items:center;gap:14px;font:700 38px var(--f-head);padding:4px 4px 14px;border-bottom:1.5px solid var(--line);margin-bottom:14px}
.bucket h3 i{width:22px;height:22px;border-radius:5px;background:var(--acc);flex:none}
.bucket:nth-child(2) h3 i{background:var(--ink)}
.bucket:nth-child(3) h3 i{background:var(--acc2)}
.b-items{flex:1;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
.bucket.over,.picking .bucket:hover{border-color:var(--ink);background:var(--acc-soft)}

/* order */
.ord{display:flex;flex-direction:column;gap:12px;max-width:1340px}
.ord-item{display:flex;align-items:center;gap:22px;min-height:82px;padding:10px 22px 10px 12px;border-radius:18px;background:var(--paper);border:2.5px solid var(--line);color:var(--ink);font:500 36px/1.25 var(--f-body);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .15s,border-color .15s,opacity .15s}
.ord-item .grip{margin-left:auto;color:var(--muted);width:34px;height:34px}
.ord-item:hover{border-color:var(--line2)}
.ord-item.sel,.ord-item.over{border-color:var(--ink);background:var(--acc-soft)}
.ord-item.dragging{opacity:.25}
.ord-item.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord-item.bad{border-color:var(--bad);background:var(--bad-soft)}

/* match */
.match{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 180px 1fr;align-items:center}
.m-col{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.m-card{position:relative;min-height:88px;padding:10px 30px;border-radius:18px;background:var(--paper);border:2.5px solid var(--line);color:var(--ink);font:500 36px/1.2 var(--f-body);display:flex;align-items:center;text-align:left;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:border-color .15s,background .15s}
.m-card:hover{border-color:var(--line2)}
.m-card .dot{position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.m-l .dot{right:-14px} .m-r .dot{left:-14px}
.m-card.paired{border-color:var(--ink)}
.m-card.paired .dot{background:var(--ink)}
.m-card.sel{border-color:var(--ink);background:var(--acc-soft)}
.m-card.sel .dot{background:var(--acc)}
.m-card.ok{background:var(--ok-soft);border-color:var(--ok)} .m-card.ok .dot{background:var(--ok);border-color:var(--ok)}
.m-card.bad{background:var(--bad-soft);border-color:var(--bad)} .m-card.bad .dot{background:var(--bad);border-color:var(--bad)}
svg.m-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.m-lines line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.m-lines line.ok{stroke:var(--ok)} .m-lines line.bad{stroke:var(--bad)}
.m-lines line.tmp{stroke-dasharray:2 12;stroke-width:5}

/* quiz */
.quiz{flex:1;min-height:0;display:flex;flex-direction:column}
.q-start,.q-end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px}
.q-ico{width:120px;height:120px;border-radius:34px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-bottom:6px}
.q-ico svg{width:60px;height:60px}
.q-big{font:800 84px/1.06 var(--f-head);letter-spacing:-.025em;max-width:1200px}
.q-info{font:500 34px var(--f-body);color:var(--ink2);margin-bottom:10px}
.q-score{font:800 150px/1 var(--f-head);letter-spacing:-.03em}
.q-head{display:flex;align-items:center;gap:22px;margin-bottom:18px}
.q-num{font:700 28px var(--f-body);color:var(--ink2);white-space:nowrap}
.q-timer{flex:1;height:18px;border-radius:99px;background:#E9E9E3;overflow:hidden}
.q-timer i{display:block;height:100%;width:100%;background:var(--ink);border-radius:99px}
.q-timer.low i{background:var(--bad)}
.q-sec{font:700 42px var(--f-head);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.q-q{font:800 60px/1.12 var(--f-head);letter-spacing:-.015em;margin:4px 0 28px;max-width:1440px;text-wrap:balance}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.q-opt{display:flex;align-items:center;gap:22px;min-height:128px;padding:14px 24px;border-radius:22px;background:var(--paper);border:2.5px solid var(--line);font:500 42px/1.2 var(--f-body);text-align:left;transition:border-color .15s,background .15s,opacity .2s}
.q-opt:hover{border-color:var(--ink)}
.q-opt .L{flex:none;width:70px;height:70px;border-radius:17px;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 34px var(--f-head)}
.q-opts.two .q-opt{min-height:220px;justify-content:center;font-size:56px;font-weight:600}
.q-opts.locked .q-opt{pointer-events:none}
.q-opts.locked .q-opt:not(.ok):not(.bad){opacity:.4}
.q-opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.q-opt.ok .L{background:var(--ok)}
.q-opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.q-opt.bad .L{background:var(--bad)}
.q-fb{display:flex;align-items:center;gap:16px;margin-top:auto;padding-top:18px;min-height:90px}
.q-msg{font:700 42px var(--f-head)}
.q-msg.ok{color:var(--ok)} .q-msg.bad{color:var(--bad)}
.q-fb .btn{margin-left:auto}

/* ---------- batch 2: formulas in cards ---------- */
.chip .katex,.m-card .katex,.q-opt .katex,.ord-item .katex,.mem-c .katex,.voc-c .katex,.cmp-c .katex,.ex-card .katex,.in-q .katex,.er-row .katex,.er-fix .katex{font-size:1.2em}

/* vocab */
.voc{display:flex;flex-direction:column;gap:12px}
.voc-h,.voc-r{display:grid;gap:12px;grid-template-columns:var(--cols)}
.voc-h button{height:66px;border-radius:18px;background:var(--ink);color:#fff;font:700 30px var(--f-head);display:flex;align-items:center;justify-content:space-between;padding:0 22px;border:2.5px solid var(--ink)}
.voc-h button svg{width:30px;height:30px;color:var(--acc-dk)}
.voc-h button.off{background:var(--paper);color:var(--ink)}
.voc-h button.off svg{color:var(--ink)}
.voc-c{position:relative;display:flex;align-items:center;gap:14px;min-height:92px;padding:8px 14px 8px 22px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;font:500 34px/1.2 var(--f-body)}
.voc-c:first-child{font-weight:700}
.voc-c .tr{display:block;font:400 24px/1.3 var(--f-body);color:var(--muted);margin-top:2px}
.voc-c .say{margin-left:auto;flex:none;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--hover);color:var(--ink)}
.voc-c .say svg{width:28px;height:28px}
.voc-c.hid{background:var(--acc-soft);border:2px dashed var(--line2);cursor:pointer}
.voc-c.hid .tx,.voc-c.hid .say{visibility:hidden}
.voc-c.hid::after{content:"?";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:800 44px var(--f-head);color:var(--ink2)}

/* rule */
.rule-box{background:var(--ink);color:#fff;border-radius:28px;padding:28px 40px;font:500 42px/1.32 var(--f-body)}
.rule-box mark{box-shadow:none;background:var(--acc);color:var(--acc-ink);padding:0 .14em;border-radius:6px}
.rule-box .rf{font-size:62px;margin-top:6px;color:var(--acc-dk)}
.rule-box .rf .katex-display{margin:.3em 0 0}
.rule-ex{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.ex-card{display:flex;align-items:center;gap:20px;min-height:110px;padding:12px 22px;border-radius:22px;background:var(--paper);border:2.5px solid var(--line);color:var(--ink);font:400 36px/1.3 var(--f-body);text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.ex-card:hover{border-color:var(--ink)}
.ex-card .v{flex:none;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:var(--hover);color:var(--ink2);font:800 34px var(--f-head)}
.ex-card .v svg{width:34px;height:34px}
.ex-card .fix{display:none;font:500 32px/1.3 var(--f-body);color:var(--ok);margin-top:6px}
.ex-card.shown .fix{display:block}
.ex-card.ok{border-color:var(--ok);background:var(--ok-soft)} .ex-card.ok .v{background:var(--ok);color:#fff}
.ex-card.bad{border-color:var(--bad);background:var(--bad-soft)} .ex-card.bad .v{background:var(--bad);color:#fff}
.ex-card.bad .tx{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}

/* compare */
.cmp{display:grid;gap:12px}
.cmp-h{min-height:74px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 34px/1.15 var(--f-head);padding:8px 16px;text-align:center}
.cmp-h.h0{background:var(--acc);color:var(--acc-ink)}
.cmp-h.h2{background:var(--acc2);color:var(--ink)}
.cmp-l{display:flex;align-items:center;font:700 32px/1.15 var(--f-head);color:var(--ink2);padding:0 6px}
.cmp-c{display:flex;align-items:center;min-height:92px;padding:10px 24px;border-radius:18px;background:var(--paper);border:1.5px solid var(--line);font:400 33px/1.25 var(--f-body)}
.cmp .hide{visibility:hidden}

/* timeline */
.tl{position:relative;flex:1;min-height:0}
.tl-line{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--ink);border-radius:3px}
.tl-dot{position:absolute;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--acc);border:7px solid var(--ink);z-index:1}
.tl-stem{position:absolute;width:3px;margin-left:-1.5px;height:40px;background:var(--line2)}
.tl-stem.up{bottom:calc(50% + 19px)} .tl-stem.down{top:calc(50% + 19px)}
.tl-ev{position:absolute}
.tl-ev.up{bottom:calc(50% + 66px)} .tl-ev.down{top:calc(50% + 66px)}
.tl-date{font:800 54px/1 var(--f-head);letter-spacing:-.02em}
.tl-t{font:700 34px/1.15 var(--f-head);margin-top:10px}
.tl-x{font:400 28px/1.28 var(--f-body);color:var(--ink2);margin-top:6px}
.tl .hide{visibility:hidden}

/* graph */
.gr{flex:1;min-height:0;display:grid;grid-template-columns:1fr 520px;gap:32px}
.gr-plot{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:12px;min-height:0;display:flex}
.gr-plot svg{width:100%;height:100%;display:block}
.gr-plot .gl{stroke:#ECECE6;stroke-width:1.5}
.gr-plot .ga{stroke:var(--ink);stroke-width:3}
.gr-plot .gt{font:600 27px var(--f-body);fill:var(--ink2)}
.gr-plot .gn{font:italic 700 36px "Times New Roman",serif;fill:var(--ink)}
.gr-plot .gc{fill:none;stroke:var(--acc);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.gr-side{display:flex;flex-direction:column;gap:18px;min-height:0}
.gr-f{background:var(--ink);color:#fff;border-radius:24px;padding:12px 20px;display:flex;align-items:center;justify-content:center;font-size:50px;min-height:120px}
.gr-f .katex-display{margin:0}
.gr-p .pl{display:flex;justify-content:space-between;align-items:center;font-size:40px}
.gr-p .pv{font:800 40px var(--f-head);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.gr-p input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:99px;background:#E6E6E0;outline:none;margin:12px 0 4px;cursor:pointer}
.gr-p input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:50px;height:50px;border-radius:50%;background:var(--ink);border:9px solid var(--acc);cursor:pointer}
.gr-p input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--ink);border:9px solid var(--acc);cursor:pointer}
.gr-notes{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:auto}
.gr-notes li{display:flex;gap:14px;font:400 28px/1.3 var(--f-body)}
.gr-notes li i{flex:none;width:14px;height:14px;border-radius:4px;background:var(--acc);border:0;margin-top:11px}

/* build */
.b-formula{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1.5px solid var(--line);border-radius:28px;font-size:96px;margin-bottom:18px}
.b-formula .katex-display{margin:0}
.fslot{cursor:pointer;border-radius:14px;transition:background .15s}
.fslot.empty .fbox{border-style:dashed!important}
.fslot.over,.picking .fslot:hover{background:var(--acc-soft)}
.fslot.ok{background:var(--ok-soft)} .fslot.ok .fbox{border-color:var(--ok)!important}
.fslot.bad{background:var(--bad-soft)} .fslot.bad .fbox{border-color:var(--bad)!important}
.fb-slot{display:inline-block;min-width:1.2em;border:3px dashed var(--line2);border-radius:10px;padding:0 .15em;text-align:center}
.chip.used{opacity:.18;pointer-events:none}
.tpl-build .bank .chip{min-width:100px;height:80px;font-size:44px}

/* input */
.inw{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto;gap:36px;align-items:start}
.in-list{display:flex;flex-direction:column;gap:14px}
.in-row{display:grid;grid-template-columns:56px 1fr auto auto;align-items:center;gap:20px;min-height:104px;padding:10px 22px 10px 14px;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;transition:border-color .15s,background .15s}
.in-q{font:500 36px/1.25 var(--f-body)}
.inp{width:240px;height:78px;border-radius:16px;border:2.5px solid var(--line2);background:#FCFCFA;font:700 40px var(--f-head);display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--ink);text-align:center;outline:none;cursor:text}
input.inp{display:block}
.inp.act,input.inp:focus{border-color:var(--ink);background:var(--acc-soft)}
div.inp.act::after{content:"";width:3px;height:44px;background:var(--ink);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.in-u{font:500 36px var(--f-body);color:var(--ink2);min-width:30px}
.in-row.ok{border-color:var(--ok);background:var(--ok-soft)} .in-row.ok .inp{border-color:var(--ok);background:#fff}
.in-row.bad{border-color:var(--bad);background:var(--bad-soft)} .in-row.bad .inp{border-color:var(--bad);background:#fff}
.keypad{display:grid;grid-template-columns:repeat(4,96px);gap:12px}
.key{height:96px;border-radius:20px;background:var(--paper);border:2px solid var(--line2);color:var(--ink);font:700 42px var(--f-head);display:grid;place-items:center;transition:background .1s}
.key:active{background:var(--acc-soft)}
.key.wide{grid-column:span 2}
.key.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.key svg{width:38px;height:38px}

/* find the error */
.er-list{display:flex;flex-direction:column;gap:10px}
.er-row,.er-fix{display:flex;align-items:center;gap:20px;min-height:70px;padding:6px 24px 6px 10px;border-radius:20px;font:400 34px/1.25 var(--f-body);text-align:left;width:100%}
.er-row{background:var(--paper);border:2.5px solid var(--line);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.er-row:hover{border-color:var(--ink)}
.er-row.nope{border-color:var(--line2);background:var(--hover);animation:shake .4s}
.er-row.found{border-color:var(--bad);background:var(--bad-soft);cursor:default}
.er-row.found .n{background:var(--bad);color:#fff}
.er-row.found .tx{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.er-fix{background:var(--ok-soft);border:2.5px solid var(--ok);font-weight:500;animation:pop .35s ease}
.er-fix .n{background:var(--ok);color:#fff}
.er-fix .n svg{width:30px;height:30px}
.er-why{margin-top:12px;padding-top:16px;padding-bottom:16px}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* label the picture */
.lab{flex:1;min-height:0;display:grid;grid-template-columns:1fr 600px;gap:32px;margin-bottom:16px}
.lab-art{min-height:0;display:flex;align-items:center;justify-content:center;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:16px;overflow:hidden}
.lab-wrap{position:relative;flex:none}
.lab-wrap svg,.lab-wrap img{width:100%;height:100%;display:block;object-fit:contain}
.lab-pin{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);border:4px solid #fff;display:grid;place-items:center;font:800 28px var(--f-head);pointer-events:none}
.lab-list{display:flex;flex-direction:column;gap:10px;justify-content:center}
.lab-row{display:flex;align-items:center;gap:16px}
.lab-row .slot{flex:1;margin:0;min-width:0;justify-content:flex-start;padding:0 2px}

/* memory */
.mem{flex:1;min-height:0;display:grid;gap:16px}
.mem-c{position:relative;border-radius:22px;border:2.5px solid var(--ink);background:var(--ink);color:var(--ink);display:grid;place-items:center;padding:8px 14px;font:500 34px/1.2 var(--f-body);text-align:center;cursor:pointer;min-height:0}
.mem-c .back{position:absolute;inset:0;display:grid;place-items:center;color:var(--acc-dk)}
.mem-c .back svg{width:60px;height:60px}
.mem-c .face{visibility:hidden}
.mem-c.open{background:var(--paper)}
.mem-c.open .face{visibility:visible}
.mem-c.open .back{visibility:hidden}
.mem-c.done{background:var(--ok-soft);border-color:var(--ok);cursor:default}
.mem-stats{display:flex;gap:32px;font:600 30px var(--f-body);color:var(--ink2)}
.mem-stats b{font:800 36px var(--f-head);color:var(--ink)}

/* ---------- batch 3 ---------- */
/* process */
.pr{position:relative;flex:1;min-height:0}
.pr svg.pr-arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pr-arrows path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.pr-node{position:absolute;width:390px;transform:translate(-50%,-50%);background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:16px 22px 18px 16px;display:flex;gap:16px;align-items:flex-start;z-index:1}
.pr-node .n{flex:none}
.pr-node b{display:block;font:700 34px/1.15 var(--f-head)}
.pr-node .tx{display:block;font:400 26px/1.3 var(--f-body);color:var(--ink2);margin-top:6px}
.pr-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;text-align:center;font:700 26px/1.15 var(--f-head);padding:12px}
.pr-center svg{width:64px;height:64px}
.pr.lin{display:flex;align-items:center}
.pr.lin .pr-node{position:static;transform:none;flex:1;width:auto;flex-direction:column;min-height:260px}
.pr-arr{flex:none;width:64px;display:grid;place-items:center}
.pr-arr svg{width:44px;height:44px}
.pr .hide{visibility:hidden}

/* cause & effect */
.cs{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center}
.cs-row{display:grid;grid-template-columns:1fr 90px 1fr;align-items:stretch}
.cs-hd{margin-bottom:-4px}
.cs-c,.cs-e{min-height:108px;border-radius:22px;padding:14px 26px;display:flex;align-items:center;font:500 33px/1.25 var(--f-body);text-align:left}
.cs-c{background:var(--ink);color:#fff}
.cs-e{background:var(--paper);border:2.5px solid var(--ink);color:var(--ink);cursor:pointer;position:relative}
.cs-e.hid{background:var(--acc-soft);border-style:dashed;border-color:var(--line2);justify-content:center}
.cs-e.hid span{visibility:hidden}
.cs-e.hid::after{content:"?";position:absolute;font:800 46px var(--f-head);color:var(--ink2)}
.cs-e:not(.hid){animation:pop .35s ease}
.cs-arr{display:grid;place-items:center}
.cs-arr svg{width:52px;height:52px}

/* reaction */
.rx-eq{background:var(--paper);border:1.5px solid var(--line);border-radius:28px;display:flex;align-items:center;justify-content:center;min-height:190px;font-size:74px;margin-bottom:22px;padding:10px}
.rx-eq .katex-display{margin:0}
.rx{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rx .lbl{display:block;margin-bottom:12px}
.rx-list{display:flex;flex-direction:column;gap:12px}
.rx-s{display:flex;align-items:center;gap:22px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:12px 24px;min-height:84px}
.rx-s .f{font-size:44px;min-width:150px}
.rx-s .nm{font:500 31px/1.2 var(--f-body)}
.rx-foot{margin-top:auto}
.rx-kind{flex:none;display:inline-flex;align-items:center;height:56px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--acc-dk);font:700 28px var(--f-head)}

/* code */
.cd{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.cd-code{background:#0B0B0C;border-radius:24px;padding:22px 0;overflow:hidden;font:500 34px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#F4F4F0;min-height:0}
.cd-line{display:flex;padding-right:24px;border-left:8px solid transparent;white-space:pre;transition:background .2s}
.cd-line .ln{width:62px;text-align:right;padding-right:22px;color:#55555C;flex:none;user-select:none}
.cd-line.cur{background:#232328;border-left-color:var(--acc-dk)}
.cd-line.cur .ln{color:var(--acc-dk)}
.tk-k{color:var(--acc-dk);font-weight:700} .tk-b{color:#6FD3C5} .tk-s{color:#FFB3D9} .tk-n{color:#FFD27A} .tk-c{color:#7C7C83;font-style:italic}
.cd-side{display:flex;flex-direction:column;gap:18px;min-height:0}
.cd-exp{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:22px 28px;font:400 34px/1.35 var(--f-body);min-height:0}
.cd-exp .lbl,.cd-out .lbl{display:block;margin-bottom:10px}
.cd-out{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:18px 28px;min-height:140px}
.cd-out .ot{font:600 38px/1.35 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.cd-side .g-foot{padding-top:0}

/* facts */
.fx{flex:1;min-height:0;display:grid;gap:20px}
.fx-c{background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:24px 32px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.fx-c:nth-child(1){background:var(--ink);color:#fff;border-color:var(--ink)}
.fx-c:nth-child(1) .fx-l{color:#D4D4DA}
.fx-c:nth-child(4){background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fx-c:nth-child(4) .fx-l{color:var(--acc-ink);opacity:.9}
.fx-v{font:800 86px/1 var(--f-head);letter-spacing:-.03em;white-space:nowrap}
.fx-v small{font:700 42px var(--f-head);margin-left:12px;letter-spacing:0}
.fx-l{font:400 31px/1.3 var(--f-body);color:var(--ink2);margin-top:14px}
.fx-src{font:400 22px var(--f-body);color:var(--muted);margin-top:12px}

/* flashcards */
.fl{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;perspective:1800px}
.fl-prog{font:600 30px var(--f-body);color:var(--ink2)}
.fl-prog b{color:var(--ink);font-family:var(--f-head)}
.fl-card{position:relative;width:1040px;max-width:100%;height:360px;border-radius:32px;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;padding:30px 60px;font:800 80px/1.1 var(--f-head);cursor:pointer}
.fl-card.back{background:var(--paper);color:var(--ink);border:3px solid var(--ink);font:500 52px/1.25 var(--f-body)}
.fl-card .turn{position:absolute;right:26px;bottom:22px;color:var(--acc-dk)}
.fl-card.back .turn{color:var(--muted)}
.fl-card .turn svg{width:38px;height:38px}
.fl-btns{display:flex;gap:18px}
.fl-btns .btn{height:88px;font-size:32px;padding:0 44px;border-radius:22px}
.btn.bad-b{background:var(--paper);border:2.5px solid var(--bad);color:var(--bad)}
.btn.good-b{background:var(--ok);color:#fff;border:2.5px solid var(--ok)}
.btn.good-b svg{color:#fff}

/* speed */
.sp{flex:1;min-height:0;display:flex;flex-direction:column}
.sp .q-num b{font:800 34px var(--f-head);color:var(--ink)}
.sp-card{flex:1;min-height:0;border-radius:32px;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;text-align:center;padding:24px 60px;font:700 60px/1.15 var(--f-head);transition:border-color .15s,background .15s}
.sp-card.ok{border-color:var(--ok);background:var(--ok-soft)}
.sp-card.bad{border-color:var(--bad);background:var(--bad-soft)}
.sp-btns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.sp-btn{height:124px;border-radius:28px;font:800 46px var(--f-head);display:flex;align-items:center;justify-content:center;gap:16px}
.sp-btn svg{width:50px;height:50px}
.sp-btn.yes{background:var(--ok);color:#fff}
.sp-btn.no{background:var(--bad);color:#fff}
.sp-btn:active{transform:translateY(2px)}

/* odd one out */
.od{flex:1;min-height:0;display:flex;flex-direction:column}
.od-n{margin-bottom:16px}
.od-grid{display:grid;gap:18px;height:280px}
.od-t{border-radius:26px;background:var(--paper);border:2.5px solid var(--line);color:var(--ink);font:600 44px/1.2 var(--f-body);display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;transition:border-color .15s,background .15s,opacity .2s}
.od-t:hover{border-color:var(--ink)}
.od-t.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.od-t.dim{opacity:.4}
.od-t.nope{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
.od-why{margin-top:20px}

/* anagram */
.an{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
.an-hint{font:500 38px/1.3 var(--f-body);color:var(--ink2);text-align:center;max-width:1300px}
.an-slots,.an-tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.an-s{width:94px;height:104px;border-bottom:7px solid var(--ink);display:grid;place-items:center;font:800 60px var(--f-head);color:var(--ink);cursor:pointer}
.an-s.ok{color:var(--ok);border-color:var(--ok)}
.an-slots.bad{animation:shake .4s}
.an-slots.bad .an-s{color:var(--bad);border-color:var(--bad)}
.an-tile{width:94px;height:104px;border-radius:22px;background:var(--ink);color:#fff;font:800 56px var(--f-head);display:grid;place-items:center}
.an-tile:active{background:#26262B}
.an-tile.used{visibility:hidden}

/* balance */
.bl-eq{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--paper);border:1.5px solid var(--line);border-radius:28px;padding:18px 24px;flex-wrap:wrap}
.bl-sub{display:flex;align-items:center;gap:10px}
.bl-co{display:flex;flex-direction:column;align-items:center;gap:6px}
.bl-co button{width:66px;height:54px;border-radius:14px;background:var(--hover);border:1.5px solid var(--line2);font:700 34px var(--f-head);display:grid;place-items:center;color:var(--ink)}
.bl-co button:active{background:var(--acc-soft)}
.bl-co .v{font:800 64px/1 var(--f-head);min-width:60px;text-align:center;color:var(--acc)}
.bl-co .v.one{color:var(--line2)}
.bl-f{font-size:66px}
.bl-op{font-size:60px;color:var(--ink2);padding:0 4px}
.bl-tab{display:grid;gap:10px;margin-top:22px}
.bl-row{display:grid;grid-template-columns:200px 1fr 1fr 72px;align-items:center;gap:12px}
.bl-row>div{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;height:68px;display:grid;place-items:center;font:700 36px var(--f-head)}
.bl-row .st{background:transparent;border:0;color:var(--ok)}
.bl-row .st svg{width:44px;height:44px}
.bl-row.ok>div:not(.st){border-color:var(--ok);background:var(--ok-soft)}
.bl-hd .lbl{text-align:center}

/* ---------- batch 4 ---------- */
/* reading */
.rd{flex:1;min-height:0;display:grid;grid-template-columns:1.3fr 1fr;gap:32px}
.rd-text{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:26px 34px;font:400 33px/1.52 var(--f-body);overflow:hidden;min-height:0}
.rd-text p+p{margin-top:14px}
.rd-text p:first-of-type{padding-right:64px}
.rd-say{position:absolute;right:18px;top:18px;width:60px;height:60px;border-radius:16px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.rd-say svg{width:30px;height:30px}
.rd-q{display:flex;flex-direction:column;gap:14px;min-height:0}
.rq{text-align:left;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;padding:14px 22px 16px 14px;display:flex;gap:16px;align-items:flex-start;color:var(--ink);transition:border-color .15s,background .15s}
.rq b{display:block;font:600 31px/1.3 var(--f-body);padding-top:8px}
.rq .ans{display:none;margin-top:8px;font:500 30px/1.3 var(--f-body);color:var(--ok)}
.rq.open{border-color:var(--ok);background:var(--ok-soft)}
.rq.open .ans{display:block;animation:pop .3s ease}

/* dialogue */
.dl{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.dl-line{display:flex;align-items:flex-end;gap:16px;max-width:1180px}
.dl-line.r{flex-direction:row-reverse;align-self:flex-end}
.dl-who{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dl-av{width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 30px var(--f-head);overflow:hidden}
.dl-av img{width:100%;height:100%;object-fit:cover}
.dl-line.r .dl-av{background:var(--ink);color:#fff}
.dl-nm{font:600 20px var(--f-body);color:var(--muted);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-b{background:var(--paper);border:2px solid var(--line);border-radius:26px 26px 26px 8px;padding:12px 14px 12px 24px;display:flex;align-items:center;gap:16px}
.dl-line.r .dl-b{border-radius:26px 26px 8px 26px;background:var(--acc-soft);border-color:var(--acc-line)}
.dl-t{display:block;font:500 34px/1.28 var(--f-body)}
.dl-tr{display:block;font:400 25px/1.3 var(--f-body);color:var(--ink2);margin-top:3px}
.dl-b .say{flex:none;width:54px;height:54px;border-radius:14px;background:var(--hover);display:grid;place-items:center;color:var(--ink)}
.dl-b .say svg{width:28px;height:28px}
.dl .hide{visibility:hidden}

/* quote */
.qt{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:center}
.qt-mark{display:block;font:800 200px/1 var(--f-head);color:var(--acc);height:96px;margin-top:-20px}
.qt-text{font:800 70px/1.1 var(--f-head);letter-spacing:-.02em}
.qt-tr{font:400 34px/1.35 var(--f-body);color:var(--ink2);margin-top:22px}
.qt-who{display:flex;align-items:center;gap:22px;margin-top:40px}
.qt-av{flex:none;width:96px;height:96px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 36px var(--f-head);overflow:hidden}
.qt-av img{width:100%;height:100%;object-fit:cover}
.qt-name{font:700 38px/1.15 var(--f-head)}
.qt-role{font:400 28px/1.3 var(--f-body);color:var(--ink2);margin-top:4px}
.qt-facts{list-style:none;background:var(--paper);border:1.5px solid var(--line);border-radius:26px;padding:28px;display:flex;flex-direction:column;gap:20px}
.qt-facts li{display:flex;gap:16px;align-items:flex-start;font:400 30px/1.32 var(--f-body)}
.qt-facts .n{width:46px;height:46px;font-size:24px;border-radius:12px}

/* hotspot */
.hs{flex:1;min-height:0;display:grid;grid-template-columns:1fr 600px;gap:32px}
.hs-list{display:flex;flex-direction:column;gap:12px;justify-content:center;min-height:0}
.hs-i{text-align:left;background:var(--paper);border:2.5px solid var(--line);border-radius:22px;padding:12px 20px 12px 12px;display:flex;gap:16px;align-items:flex-start;color:var(--ink);transition:border-color .15s,background .15s}
.hs-i b{display:block;font:700 33px/1.2 var(--f-head);padding-top:10px}
.hs-i .tx{display:none;font:400 28px/1.35 var(--f-body);color:var(--ink2);margin-top:8px}
.hs-i.open{border-color:var(--acc);background:var(--acc-soft)}
.hs-i.open .tx{display:block;animation:pop .3s ease}
.hs-pin{pointer-events:auto;cursor:pointer;transition:transform .15s,background .15s}
.hs-pin.on{background:var(--ink);transform:scale(1.2)}

/* mind map */
.mm{position:relative;flex:1;min-height:0}
.mm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mm svg line{stroke:var(--line2);stroke-width:4;stroke-linecap:round}
.mm-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;min-height:130px;padding:18px 24px;border-radius:999px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;text-align:center;font:800 38px/1.1 var(--f-head);z-index:2}
.mm-b{position:absolute;width:370px;transform:translate(-50%,-50%);background:var(--paper);border:2.5px solid var(--ink);border-top-width:8px;border-top-color:var(--acc);border-radius:22px;padding:12px 20px 16px;z-index:1}
.mm-b b{display:block;font:700 32px/1.15 var(--f-head)}
.mm-b ul{list-style:none;margin-top:6px}
.mm-b li{font:400 26px/1.3 var(--f-body);color:var(--ink2)}
.mm-b li::before{content:"— ";color:var(--acc)}
.mm .hide{visibility:hidden}

/* crossword */
.cw{flex:1;min-height:0;display:grid;grid-template-columns:1fr 560px;gap:32px}
.cw-wrap{min-height:0;display:flex;align-items:center;justify-content:center}
.cw-grid{position:relative;flex:none}
.cw-cell{position:absolute;width:var(--cs);height:var(--cs);border:2.5px solid var(--ink);margin:-1.25px 0 0 -1.25px;background:#fff;display:grid;place-items:center;font:800 var(--fs) var(--f-head);color:var(--ink);cursor:pointer;transition:background .15s}
.cw-cell .num{position:absolute;left:4px;top:1px;font:700 var(--ns) var(--f-body);color:var(--ink2);line-height:1}
.cw-cell.sel{background:var(--acc-soft)}
.cw-cell.ok{background:var(--ok-soft);color:var(--ok)}
.cw-cell.bad{background:var(--bad-soft);color:var(--bad)}
.cw-side{display:flex;flex-direction:column;gap:12px;min-height:0}
.cw-clues{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cw-clues .lbl{margin:6px 0 2px}
.cw-cl{text-align:left;font:400 27px/1.25 var(--f-body);padding:6px 12px;border-radius:12px;color:var(--ink);display:flex;gap:10px}
.cw-cl b{min-width:32px;font-family:var(--f-head)}
.cw-cl.sel{background:var(--acc-soft)}
.cw-cl.done{color:var(--ok)}
.cw-in{display:flex;gap:10px}
.cw-in input{flex:1;min-width:0;height:72px;border-radius:16px;border:2.5px solid var(--ink);font:700 34px var(--f-head);padding:0 18px;text-transform:uppercase;outline:none;background:#fff}
.cw-in input:focus{background:var(--acc-soft)}

/* word search */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center}
.ws-grid{display:grid;gap:5px;user-select:none;-webkit-user-select:none;touch-action:none}
.ws-c{width:var(--cs);height:var(--cs);border-radius:12px;display:grid;place-items:center;font:700 var(--fs) var(--f-head);background:var(--paper);border:1.5px solid var(--line);cursor:pointer;color:var(--ink)}
.ws-c.f{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.ws-c.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.ws-c.miss{background:var(--bad-soft);border-color:var(--bad)}
.ws-side{display:flex;flex-direction:column;gap:18px;align-self:stretch;justify-content:center}
.ws-st{font:600 32px var(--f-body);color:var(--ink2)}
.ws-st b{font:800 40px var(--f-head);color:var(--ink)}
.ws-list{display:flex;flex-wrap:wrap;gap:12px}
.ws-w{padding:10px 20px;border-radius:14px;border:2.5px solid var(--ink);font:700 32px var(--f-head)}
.ws-w.found{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);text-decoration:line-through;text-decoration-thickness:3px}

/* guess the word */
.gs{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.gs-hint{font:500 38px/1.3 var(--f-body);color:var(--ink2);text-align:center;max-width:1300px}
.gs-word{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.gs-l{width:76px;height:90px;border-bottom:6px solid var(--ink);display:grid;place-items:center;font:800 56px var(--f-head)}
.gs-l.sp{border-bottom-color:transparent;width:36px}
.gs-l.miss{color:var(--bad)}
.gs-l.win{color:var(--ok);border-color:var(--ok)}
.gs-lives{display:flex;gap:10px}
.gs-lives i{width:24px;height:24px;border-radius:50%;background:var(--acc)}
.gs-lives i.off{background:var(--line)}
.gs-kb{display:flex;flex-direction:column;gap:8px;align-items:center}
.gs-row{display:flex;gap:8px}
.gs-k{width:68px;height:70px;border-radius:14px;background:var(--paper);border:2px solid var(--line2);font:700 32px var(--f-head);color:var(--ink)}
.gs-k:active{background:var(--acc-soft)}
.gs-k.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gs-k.no{background:var(--hover);color:var(--line2);border-color:var(--line)}

/* wheel */
.wh{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center}
.wh-box{position:relative;width:600px;height:600px}
.wh-box svg{width:100%;height:100%;display:block}
.wh-ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:48px solid var(--ink);z-index:2}
.wh-hub{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:#fff;border:7px solid var(--ink);display:grid;place-items:center;color:var(--ink)}
.wh-hub svg{width:44px;height:44px}
.wh-side{display:flex;flex-direction:column;gap:20px}
.wh-res{min-height:170px;border-radius:28px;background:var(--paper);border:2.5px solid var(--line);display:grid;place-items:center;text-align:center;font:800 64px/1.1 var(--f-head);padding:20px;color:var(--ink)}
.wh-res.wait{font:500 32px var(--f-body);color:var(--muted)}
.wh-res.pop{animation:pop .4s ease;border-color:var(--acc)}
.wh-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.wh-tog{display:flex;align-items:center;gap:14px;font:500 28px var(--f-body);cursor:pointer}
.wh-tog input{width:34px;height:34px;accent-color:var(--acc)}
.wh-picked{font:500 28px/1.4 var(--f-body);color:var(--ink2)}
.wh-edit{position:absolute;inset:0;background:var(--slide);z-index:30;display:flex;flex-direction:column;padding:52px 80px 44px;gap:16px}
.wh-edit[hidden]{display:none}
.wh-edit textarea{flex:1;border-radius:20px;border:2.5px solid var(--ink);font:500 32px/1.4 var(--f-body);padding:20px 24px;resize:none;outline:none;background:#fff}

/* quiz board */
.jp{flex:1;min-height:0;display:grid;gap:12px}
.jp-h{border-radius:18px;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;font:700 32px/1.1 var(--f-head);padding:8px 12px}
.jp-c{border-radius:18px;background:var(--acc);color:var(--acc-ink);font:800 56px var(--f-head);display:grid;place-items:center;transition:opacity .2s,background .2s}
.jp-c:hover{opacity:.9}
.jp-c.used{background:var(--hover);color:var(--line2);cursor:default}
.jp-m{position:absolute;inset:36px 56px;background:var(--slide);border:3px solid var(--ink);border-radius:30px;z-index:20;display:flex;flex-direction:column;padding:36px 44px;gap:20px;animation:pop .25s ease}
.jp-m[hidden]{display:none}
.jp-m .meta{display:flex;justify-content:space-between;align-items:center;font:700 32px var(--f-head);color:var(--ink2)}
.jp-m .meta b{color:var(--acc);font-size:52px}
.jp-q{flex:1;display:grid;place-items:center;text-align:center;font:800 64px/1.15 var(--f-head)}
.jp-a{display:none;align-self:center;padding:14px 40px;border-radius:22px;background:var(--ok-soft);border:2.5px solid var(--ok);font:700 48px var(--f-head);color:var(--ok)}
.jp-m.show .jp-a{display:block;animation:pop .3s ease}
.jp-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* theme picker */
.th-pop{position:absolute;right:12px;bottom:calc(100% + 10px);display:flex;gap:10px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;z-index:11}
.th-pop[hidden]{display:none}
.th-sw{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.th-sw.on{box-shadow:0 0 0 3px var(--ink)}

/* ---------- batch 5 ---------- */
/* lab */
.lb{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.lb-l{display:flex;flex-direction:column;gap:18px;min-height:0}
.lb-l .lbl{display:block;margin-bottom:8px}
.lb-goal{font:500 30px/1.3 var(--f-body)}
.lb-eq{display:flex;flex-wrap:wrap;gap:10px}
.lb-chip{padding:8px 16px;border-radius:12px;background:var(--acc-soft);border:1.5px solid var(--acc-line);font:500 26px var(--f-body)}
.lb-steps{list-style:none;display:flex;flex-direction:column;gap:10px}
.lb-steps li{display:flex;gap:14px;align-items:flex-start;font:400 28px/1.3 var(--f-body)}
.lb-steps .n{width:44px;height:44px;font-size:22px;border-radius:12px;margin-top:-4px}
.lb-r{display:flex;flex-direction:column;gap:16px;min-height:0}
.lb-t{width:100%;border-collapse:separate;border-spacing:0;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff}
.lb-t th{background:var(--acc);color:var(--acc-ink);font:700 28px var(--f-head);padding:14px 10px}
.lb-t td{border-top:1.5px solid var(--line);text-align:center;font:600 32px var(--f-head);height:76px;padding:0 8px}
.lb-t td+td,.lb-t th+th{border-left:1.5px solid var(--line)}
.lb-t td:first-child{color:var(--muted);width:70px}
.lb-t input{width:100%;height:58px;border:2px dashed var(--line2);border-radius:12px;text-align:center;font:600 32px var(--f-head);background:#FCFCFA;outline:none;color:var(--ink)}
.lb-t input:focus{border:2px solid var(--acc);background:var(--acc-soft)}
.lb-t td.calc{color:var(--acc);background:var(--acc-soft)}
.lb-c{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.lb-c .remember{margin-top:0}

/* geometry */
.gm{flex:1;min-height:0;display:grid;grid-template-columns:1fr 520px;gap:32px}
.gm-plot{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:10px;min-height:0;display:flex}
.gm-plot svg{width:100%;height:100%;display:block}
.gm-plot .sh{fill:var(--acc-soft);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.gm-plot .hl{stroke:var(--ink);stroke-width:3;stroke-dasharray:10 8;fill:none}
.gm-plot .ra{fill:none;stroke:var(--ink);stroke-width:3}
.gm-plot .lb{font:italic 700 42px "Times New Roman",Georgia,serif;fill:var(--acc)}
.gm-plot .dt{fill:var(--ink)}
.gm-side{display:flex;flex-direction:column;gap:16px;min-height:0}
.gm-f{background:var(--ink);color:#fff;border-radius:24px;padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:40px}
.gm-res{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.gm-r{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px 22px;font-size:40px}
.gm-r b{font:800 40px var(--f-head);color:var(--acc)}
.gm-r small{font:600 26px var(--f-body);color:var(--ink2);margin-left:8px}

/* video */
.vd{flex:1;min-height:0;display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.vd-box{min-height:0;border-radius:24px;overflow:hidden;background:#0B0B0C;display:flex;align-items:center;justify-content:center}
.vd-box iframe,.vd-box video{width:100%;height:100%;border:0;display:block;background:#000}
.vd-empty{display:flex;flex-direction:column;align-items:center;gap:20px;color:#fff;padding:40px;width:100%}
.vd-empty>svg{width:90px;height:90px;color:var(--acc-dk)}
.vd-empty .lbl{color:#D4D4DA;font-size:24px;text-align:center}
.vd-in{display:flex;gap:10px;width:100%;max-width:700px}
.vd-in input{flex:1;min-width:0;height:72px;border-radius:16px;border:0;font:500 28px var(--f-body);padding:0 20px;outline:none}

/* homework */
.hw{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px;gap:36px;align-items:start}
.hw-list{display:flex;flex-direction:column;gap:14px}
.hw-i{display:flex;align-items:center;gap:20px;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:16px 22px 16px 16px;font:500 34px/1.3 var(--f-body)}
.hw-lv{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:84px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font:800 36px/1 var(--f-head)}
.hw-lv small{font:600 18px var(--f-body);margin-top:6px;opacity:.9}
.hw-lv.A{background:var(--ok);color:#fff}
.hw-lv.C{background:var(--ink);color:#fff}
.hw-qr{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hw-qr .code{width:300px;height:300px}
.hw-qr .code svg{width:100%;height:100%;display:block}
.hw-qr .lk{font:600 22px var(--f-body);color:var(--ink2);word-break:break-all}
.hw-qr .tt{font:600 26px/1.25 var(--f-body)}

/* summary */
.sm{flex:1;min-height:0;display:grid;grid-template-columns:1.35fr 1fr;gap:36px}
.sm-list{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:10px}
.sm-list li{display:flex;gap:18px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:16px 22px 16px 16px;font:400 32px/1.32 var(--f-body)}
.sm-ck{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.sm-ck svg{width:30px;height:30px}
.sm-side{display:flex;flex-direction:column;gap:24px}
.sm-kw{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.sm-kw span{padding:10px 20px;border-radius:999px;background:var(--acc-soft);border:1.5px solid var(--acc-line);font:600 28px var(--f-body)}
.sm-next{background:var(--ink);color:#fff;border-radius:24px;padding:24px 28px;font:700 34px/1.25 var(--f-head)}
.sm-next .lbl{display:block;color:var(--acc-dk);margin-bottom:10px}
.sm .hide{visibility:hidden}

/* reflection */
.rf{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}
.rf-q{font:800 60px/1.1 var(--f-head);text-align:center}
.rf-opts{display:grid;gap:20px;flex:1;min-height:0}
.rf-o{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:28px;background:var(--paper);border:2.5px solid var(--line);padding:20px;color:var(--ink);transition:border-color .15s}
.rf-o:hover{border-color:var(--ink)}
.rf-o .ic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.rf-o .ic svg{width:62px;height:62px}
.rf-o .tx{font:700 36px/1.15 var(--f-head);text-align:center}
.rf-o .bar{width:80%;height:16px;border-radius:99px;background:#ECECE6;overflow:hidden}
.rf-o .bar i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .3s}
.rf-o .ct{font:800 44px var(--f-head);color:var(--c)}
.rf-o.bump{animation:pop .3s ease}
.rf-pr{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.rf-pr span{padding:12px 22px;border-radius:16px;background:var(--acc-soft);border:1.5px solid var(--acc-line);font:500 28px var(--f-body)}

/* sentence */
.sn{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.sn-hint{font:500 34px/1.3 var(--f-body);color:var(--ink2);text-align:center}
.sn-line{width:100%;min-height:118px;border-bottom:5px solid var(--ink);display:flex;flex-wrap:wrap;gap:12px;align-content:flex-end;justify-content:center;padding-bottom:14px}
.sn-line.ok{border-color:var(--ok)}
.sn-line.ok .chip{background:var(--ok-soft);border-color:var(--ok)}
.sn-line.bad{animation:shake .4s;border-color:var(--bad)}
.sn-bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:68px}
.sn .chip{cursor:pointer}

/* picture + word */
.pm{display:grid;gap:18px;margin-bottom:18px}
.pm-c{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.pm-img{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;display:grid;place-items:center;padding:14px;overflow:hidden}
.pm-img svg,.pm-img img{width:100%;height:100%;object-fit:contain;display:block}
.pm .slot{width:100%;min-width:0;margin:0}
.pm .slot .chip,.pm .bank .chip{font-size:28px;padding:0 16px}

/* flowchart */
.fc{flex:1;min-height:0;display:grid;grid-template-columns:1fr 480px;gap:32px}
.fc-flow{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.fc-flow>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fc-flow>svg path{fill:none;stroke:var(--ink);stroke-width:3.5}
.fc-flow>svg text{font:700 24px var(--f-body);fill:var(--ink2)}
.fc-b{position:relative;min-width:300px;max-width:520px;min-height:78px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 34px;font:600 30px/1.2 var(--f-body);z-index:1}
.fc-b>svg.bg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:-1}
.fc-b>svg.bg path{fill:#fff;stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke}
.fc-b.start,.fc-b.end{border-radius:999px;background:var(--ink);color:#fff;min-width:240px}
.fc-b.process{border:3px solid var(--ink);border-radius:10px;background:#fff}
.fc-b.decision{min-width:460px;min-height:116px;padding:8px 90px}
.fc-b.decision>svg.bg path{fill:var(--acc-soft)}
.fc-b.io{padding:8px 56px}
.fc-ar{position:relative;width:4px;height:40px;background:var(--ink);flex:none}
.fc-ar::after{content:"";position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);border-left:11px solid transparent;border-right:11px solid transparent;border-top:15px solid var(--ink)}
.fc-ar span{position:absolute;left:16px;top:4px;font:700 24px var(--f-body);color:var(--ink2)}
.fc-side{position:absolute;z-index:1}
.fc-flow.has-side{padding-right:390px}
.fc .slot{min-width:260px;margin:0}
.fc .slot .chip{font-size:28px;padding:0 16px}
.fc-bank{display:flex;flex-direction:column;justify-content:center;gap:16px}
.fc-bank .bank{flex-direction:column;align-items:stretch}
.fc-bank .bank .chip{font-size:28px;justify-content:flex-start}

/* final test */
.ts{flex:1;min-height:0;display:flex;flex-direction:column}
.ts-nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.ts-dot{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--line2);background:var(--paper);font:700 26px var(--f-head);color:var(--ink2)}
.ts-dot.done{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ts-dot.cur{box-shadow:0 0 0 4px var(--slide),0 0 0 7px var(--ink)}
.ts-dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ts-dot.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.q-opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.q-opt.sel .L{background:var(--acc)}
.ts-foot{display:flex;gap:14px;margin-top:auto;padding-top:20px;align-items:center}
.ts-foot .sp{flex:1}
.ts-res{flex:1;display:grid;grid-template-columns:auto 1fr;gap:60px;align-items:center}
.ts-pc{position:relative;width:320px;height:320px}
.ts-pc svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ts-pc circle{fill:none;stroke-width:34}
.ts-pc>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ts-pc b{font:800 84px/1 var(--f-head)}
.ts-pc span{font:600 30px var(--f-body);color:var(--ink2);margin-top:6px}
.ts-rv{display:flex;flex-direction:column;gap:16px}
.ts-rv .q{font:700 40px/1.2 var(--f-head)}
.ts-rv .a{font:500 32px/1.3 var(--f-body)}
.ts-rv .a.ok{color:var(--ok)} .ts-rv .a.bad{color:var(--bad)}

/* code templates */
.er-row .tx.code,.er-fix .tx.code{font:500 34px/1.4 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.pd{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:32px}
.pd-side{display:flex;flex-direction:column;gap:16px}
.pd-side .lbl{display:block}
.pd-in{width:100%;box-sizing:border-box;min-height:120px;border-radius:20px;border:2.5px solid var(--line2);background:#FCFCFA;font:600 40px/1.35 "JetBrains Mono",ui-monospace,Menlo,monospace;padding:16px 22px;outline:none;resize:none;color:var(--ink)}
.pd-in:focus{border-color:var(--ink);background:var(--acc-soft)}
.pd-in.ok{border-color:var(--ok);background:var(--ok-soft)} .pd-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.cd-code .slot{min-width:150px;height:56px;margin:0 4px;background:#1B1B1F;border-color:#55555C;vertical-align:middle}
.cd-code .slot.over,.picking .cd-code .slot:not(.filled):hover{border-color:var(--acc-dk);background:#232328}
.cd-code .slot .chip{height:50px}
.chip.mono,.cfx .bank .chip{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.cfx .cd-code{flex:none;margin-bottom:18px}
.ord-item.code{font:500 32px/1.3 "JetBrains Mono",ui-monospace,Menlo,monospace;white-space:pre;background:#0B0B0C;color:#F4F4F0;border-color:#26262B}
.ord-item.code .n{background:#232328;color:var(--acc-dk)}
.ord-item.code.sel,.ord-item.code.over{border-color:var(--acc-dk);background:#17171A}
.ord-item.code.ok{border-color:var(--ok)} .ord-item.code.bad{border-color:var(--bad)}
.st-wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:32px}
.st-wrap.nocode{grid-template-columns:1fr}
.st-list{display:flex;flex-direction:column;gap:14px}
.stp{display:flex;align-items:center;gap:20px;min-height:100px;padding:12px 22px;border-radius:22px;background:var(--paper);border:2.5px solid var(--line);font:500 34px/1.3 var(--f-body)}
.stp .q{flex:1}
.stp input{width:200px;height:76px;border-radius:16px;border:2.5px solid var(--line2);background:#FCFCFA;text-align:center;font:700 38px var(--f-head);outline:none;color:var(--ink)}
.stp input:focus{border-color:var(--ink);background:var(--acc-soft)}
.stp.cur{border-color:var(--ink)}
.stp.lock{background:transparent;border-style:dashed;color:var(--muted)}
.stp.lock .n{background:transparent;color:var(--line2);border:2px dashed var(--line2)}
.stp.ok{background:var(--ok-soft);border-color:var(--ok)} .stp.ok .n{background:var(--ok);color:#fff}
.stp.bad{border-color:var(--bad);animation:shake .4s}

/* toast & confetti */
.toast{position:absolute;left:50%;top:26px;z-index:70;display:flex;align-items:center;gap:12px;padding:18px 32px;border-radius:999px;background:var(--ink);color:#fff;font:600 32px var(--f-head);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-24px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:34px;height:34px;color:var(--acc-dk)}
.toast.bad svg{color:#FF8E91}
.cf{position:absolute;z-index:60;pointer-events:none}

/* ---------- bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 12px;background:var(--paper);border-top:1px solid var(--line);z-index:10;user-select:none;-webkit-user-select:none}
#pbar{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--ink);transition:width .3s ease}
.b-l{display:flex;gap:8px;min-width:0}
.b-c{display:flex;align-items:center;gap:6px}
.b-r{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.ib{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;transition:background .15s}
.ib:hover{background:var(--hover)}
.ib svg{width:24px;height:24px}
.ib.on{background:var(--acc);color:var(--acc-ink)}
.ib[disabled]{opacity:.3;pointer-events:none}
.b-c .ib{border:1px solid var(--line)}
.count{min-width:80px;text-align:center;font:700 18px var(--f-body);font-variant-numeric:tabular-nums}
.lang{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:12px;cursor:pointer}
.lang:hover{background:var(--hover)}
.lang svg{width:20px;height:20px}
.lang select{font:600 16px var(--f-body);appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}
.team{display:flex;align-items:center;gap:2px;height:50px;padding:0 4px 0 14px;border-radius:14px;border:1px solid var(--line);font:600 16px var(--f-body);white-space:nowrap;cursor:pointer}
.team.active{background:var(--ink);border-color:var(--ink);color:#fff}
.team .tn{margin-right:6px}
.team .tns{display:none;margin-right:6px}
.team .sc{min-width:40px;height:36px;padding:0 8px;border-radius:10px;font-size:18px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.team .pm{width:32px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:20px;line-height:1;opacity:.55}
.team .pm:hover{opacity:1}
.team.bump .sc{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.3)}}
@media (max-width:1100px){
  .team .tn{display:none}
  .team .tns{display:inline}
}
@media (max-width:700px){
  #bar{height:auto;min-height:var(--bar);grid-template-columns:auto 1fr;grid-template-areas:"c r" "l l";row-gap:8px;padding:10px 8px}
  .b-c{grid-area:c} .b-r{grid-area:r} .b-l{grid-area:l}
  .b-l:empty{display:none}
  .team{flex:1;justify-content:space-between}
  .team .tn{display:none}
  .team .tns{display:inline}
  .lang svg{display:none}
  .b-r .ib{width:38px}
  .count{min-width:56px}
}
</style>
</head>

var SUBS={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};

function texFallback(t){return t.replace(/\\ce\{([^{}]*)\}/g,function(_,x){return chemText(x);}).replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\text\{([^{}]*)\}/g,'$1').replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/\\[ ,;]/g,' ').replace(/[{}]/g,'').replace(/\\([a-zA-Z]+)/g,'$1');}

/* Разметка в любом тексте: ==маркер==, **жирный**, $формула$ */
function fmt(s){
  if(s==null)return '';
  var m=[];
  var x=String(s).replace(/\$([^$]+)\$/g,function(_,t){m.push(t);return '\uE000'+(m.length-1)+'\uE001';});
  x=esc(x).replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return x.replace(/\uE000(\d+)\uE001/g,function(_,i){return tex(m[+i],false);});
}

  toastEl.className='toast '+(kind||'');
  toastEl.innerHTML=icon(kind==='ok'?'check':kind==='bad'?'x':'info')+'<span>'+esc(msg)+'</span>';
  void toastEl.offsetWidth; toastEl.classList.add('show');

}
function sound(kind){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var t=AC.currentTime;
    var notes=kind==='ok'?[660,880]:kind==='win'?[523,659,784,1047]:kind==='tick'?[1100]:[220,175];
    var vol=kind==='tick'?0.05:0.16, len=kind==='tick'?0.06:0.22;
    notes.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=kind==='bad'?'triangle':'sine'; o.frequency.value=f;
      var st=t+i*0.09;
      g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(vol,st+0.015); g.gain.exponentialRampToValueAtTime(0.0001,st+len);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+len+0.03);
    });
  }catch(e){}
}

/* Перетаскивание + режим «нажми-нажми» для интерактивной доски */
function pickPlace(root,o){
  var sel=null;
  function setSel(c){if(sel)sel.classList.remove('sel');sel=c||null;if(sel)sel.classList.add('sel');root.classList.toggle('picking',!!sel);}
  function inRoot(x){return !!x&&root.contains(x);}
  root.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var chip=e.target.closest(o.chip); if(!inRoot(chip)||chip.classList.contains('locked'))return;
    e.preventDefault();
    try{chip.setPointerCapture(e.pointerId);}catch(_){}
    var sx=e.clientX,sy=e.clientY,r=chip.getBoundingClientRect(),drag=false,ghost=null,over=null;
    function hit(ev){var t=o.hit?o.hit(ev):null;if(!t){var x=document.elementFromPoint(ev.clientX,ev.clientY);t=x&&x.closest(o.target);}return inRoot(t)&&t!==chip?t:null;}
    function mv(ev){
      if(!drag){
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<9)return;
        drag=true; setSel(null);
        ghost=chip.cloneNode(true); ghost.classList.add('ghost');
        var gs=ghost.style; gs.position='fixed'; gs.left='0'; gs.top='0'; gs.margin='0'; gs.width=chip.offsetWidth+'px'; gs.height=chip.offsetHeight+'px'; gs.transformOrigin='0 0'; gs.pointerEvents='none'; gs.zIndex='1000';
        document.body.appendChild(ghost); chip.classList.add('dragging');
      }
      ghost.style.transform='translate('+(ev.clientX-(sx-r.left))+'px,'+(ev.clientY-(sy-r.top))+'px) scale('+S.scale+')';
      var t=hit(ev); if(t!==over){if(over)over.classList.remove('over');over=t;if(over)over.classList.add('over');}
    }
    function up(ev){
      chip.removeEventListener('pointermove',mv); chip.removeEventListener('pointerup',up); chip.removeEventListener('pointercancel',up);
      if(drag){ghost.remove();chip.classList.remove('dragging');if(over)over.classList.remove('over');var t=ev.type==='pointercancel'?null:hit(ev);if(t)o.place(chip,t);return;}
      if(sel===chip){setSel(null);return;}
      if(sel){
        var a=sel;
        if(o.swap){setSel(null);o.place(a,chip);return;}
        var tt=chip.parentElement.closest(o.target);
        if(inRoot(tt)&&!tt.classList.contains('bank')){setSel(null);o.place(a,tt);return;}
      }
      setSel(chip);
    }
    chip.addEventListener('pointermove',mv); chip.addEventListener('pointerup',up); chip.addEventListener('pointercancel',up);
  });
  root.addEventListener('click',function(e){
    if(!sel||e.target.closest(o.chip))return;
    var t=(o.hit&&o.hit(e))||e.target.closest(o.target);
    if(inRoot(t)){var a=sel;setSel(null);o.place(a,t);}
  });
  return {clear:function(){setSel(null);}};
}

    '<div class="ex-r"><span class="lbl">'+esc(T('solution'))+'</span><ol class="steps">'+steps.map(function(s,i){return '<li class="step"><span class="n">'+(i+1)+'</span><span>'+fmt(s)+'</span></li>';}).join('')+'</ol>'+

  var k=0, items=$$('.step',el), ans=$('.answer',el), bStep=$('[data-act=step]',el), max=items.length+1;

/* 6. Найди пару — соединить линиями */
TPL.match=function(d,el,ctx){
  el.classList.add('game');
  var pairs=d.pairs||[], n=pairs.length, pr=perm(n);
  el.innerHTML=head('match','link',true,hint('hintMatch'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+
    '<div class="match"><svg class="m-lines"></svg><div class="m-col">'+pairs.map(function(p,i){return '<button class="m-card m-l" data-i="'+i+'"><span>'+fmt(p[0])+'</span><span class="dot"></span></button>';}).join('')+
    '</div><div></div><div class="m-col">'+pr.map(function(i){return '<button class="m-card m-r" data-i="'+i+'"><span class="dot"></span><span>'+fmt(pairs[i][1])+'</span></button>';}).join('')+'</div></div>'+foot();
  var area=$('.match',el), svg=$('.m-lines',el), Ls=$$('.m-l',el), Rs=$$('.m-r',el);
  var link={}, sel=null, checked=false, scored=false, tmp=null;
  function R(i){for(var k=0;k<Rs.length;k++)if(+Rs[k].dataset.i===i)return Rs[k];}
  function leftOf(r){for(var l in link)if(link[l]===r)return +l;return -1;}
  function size(){return Object.keys(link).length;}
  function pt(c,side){var a=area.getBoundingClientRect(),r=c.getBoundingClientRect(),s=S.scale;return {x:((side==='l'?r.right:r.left)-a.left)/s,y:(r.top+r.height/2-a.top)/s};}
  function draw(){
    var h='';
    for(var l in link){var A=pt(Ls[l],'l'),B=pt(R(link[l]),'r');var c=checked?(+l===link[l]?'ok':'bad'):'';h+='<line class="'+c+'" x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'"/>';}
    if(tmp)h+='<line class="tmp" x1="'+tmp[0]+'" y1="'+tmp[1]+'" x2="'+tmp[2]+'" y2="'+tmp[3]+'"/>';
    svg.innerHTML=h;
    Ls.forEach(function(c,i){var p=link[i]!=null;c.classList.toggle('paired',p);c.classList.toggle('sel',sel===c);c.classList.toggle('ok',checked&&link[i]===i);c.classList.toggle('bad',checked&&p&&link[i]!==i);});
    Rs.forEach(function(c){var i=+c.dataset.i,l=leftOf(i);c.classList.toggle('paired',l>=0);c.classList.toggle('sel',sel===c);c.classList.toggle('ok',checked&&l===i);c.classList.toggle('bad',checked&&l>=0&&l!==i);});
  }
  function changed(){if(checked){checked=false;setStatus(el,'');}draw();}
  function connect(lc,rc){var l=+lc.dataset.i,r=+rc.dataset.i,o=leftOf(r);if(o>=0)delete link[o];link[l]=r;sel=null;sound('tick');changed();}
  function unlink(c){var i=+c.dataset.i;if(c.classList.contains('m-l'))delete link[i];else{var l=leftOf(i);if(l>=0)delete link[l];}}
  function tap(c){
    var isL=c.classList.contains('m-l');
    if(sel===c){sel=null;draw();return;}
    if(sel&&sel.classList.contains('m-l')!==isL){if(isL)connect(c,sel);else connect(sel,c);return;}
    if(c.classList.contains('paired'))unlink(c);
    sel=c; changed();
  }
  area.addEventListener('pointerdown',function(e){
    var c=e.target.closest('.m-card'); if(!c||e.button>0)return; e.preventDefault();
    try{c.setPointerCapture(e.pointerId);}catch(_){}
    var sx=e.clientX,sy=e.clientY,drag=false,isL=c.classList.contains('m-l');
    function mv(ev){if(!drag&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<9)return;drag=true;var A=pt(c,isL?'l':'r'),a=area.getBoundingClientRect();tmp=[A.x,A.y,(ev.clientX-a.left)/S.scale,(ev.clientY-a.top)/S.scale];draw();}
    function up(ev){
      c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);
      if(!drag){tap(c);return;}
      tmp=null; var t=document.elementFromPoint(ev.clientX,ev.clientY), o=t&&t.closest(isL?'.m-r':'.m-l');
      if(o&&area.contains(o)){if(isL)connect(c,o);else connect(o,c);}else draw();
    }
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  });
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check'){if(size()<n){toast(T('notDone'),'info');return;}checked=true;sel=null;draw();var ok=0;for(var l in link)if(+l===link[l])ok++;result(el,ctx,ok,n,!scored);scored=true;}
    if(a==='show'){link={};for(var i=0;i<n;i++)link[i]=i;checked=true;sel=null;draw();setStatus(el,T('shown'),'ok');}
    if(a==='reset'){link={};checked=false;scored=false;sel=null;setStatus(el,'');draw();}
  });
  return {enter:draw,layout:draw};
};
