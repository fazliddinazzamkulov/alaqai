/* 10. Викторина с таймером (2 варианта = «верно/неверно») */
TPL.quiz=function(d,el,ctx){
  el.classList.add('game');
  var time=+d.time||20;
  var qs=(d.questions||[]).map(function(q){var o=(q.options||[]).map(function(t,i){return {t:t,ok:i===q.answer};});if(o.length>2&&d.shuffle!==false)o=shuffle(o);return {q:q.q,o:o};});
  var i=0,score=0,phase='start',left=time,tm=null,last=0;
  el.innerHTML=head('quiz','help',true)+'<div class="quiz"></div>';
  var box=$('.quiz',el);
  function stop(){if(tm){clearInterval(tm);tm=null;}}
  function run(){stop();last=performance.now();tm=setInterval(tick,100);}
  function tick(){var now=performance.now();left-=(now-last)/1000;last=now;if(left<=0){left=0;draw();answer(-1);return;}draw();}
  function draw(){var bar=$('.q-timer',box);if(!bar)return;bar.firstChild.style.width=(left/time*100)+'%';bar.classList.toggle('low',left<=5);$('.q-sec',box).textContent=Math.ceil(left);}
  function viewStart(){phase='start';stop();box.innerHTML='<div class="q-start"><div class="q-ico">'+icon('timer')+'</div><div class="q-big">'+fmt(d.title||T('quiz'))+'</div><div class="q-info">'+qs.length+' '+esc(T('questions'))+' · '+time+' '+esc(T('secPer'))+'</div><button class="btn primary lg" data-act="start">'+icon('play')+esc(T('start'))+'</button></div>';}
  function ask(){
    phase='q'; left=time; var q=qs[i];
    box.innerHTML='<div class="q-head"><span class="q-num">'+esc(T('question'))+' '+(i+1)+' / '+qs.length+'</span><div class="q-timer"><i></i></div><span class="q-sec">'+time+'</span></div>'+
      '<div class="q-q">'+fmt(q.q)+'</div><div class="q-opts'+(q.o.length===2?' two':'')+'">'+q.o.map(function(o,k){return '<button class="q-opt" data-k="'+k+'"><span class="L">'+('ABCDEF'[k]||k+1)+'</span><span>'+fmt(o.t)+'</span></button>';}).join('')+'</div>'+
      '<div class="q-fb"><span class="q-msg"></span><button class="btn primary" data-act="next" hidden>'+esc(T(i===qs.length-1?'result':'next'))+icon('right')+'</button></div>';
    run();
  }
  function answer(k){
    if(phase!=='q')return; stop(); phase='fb';
    var q=qs[i],opts=$$('.q-opt',box),ci=-1;q.o.forEach(function(o,j){if(o.ok)ci=j;});
    $('.q-opts',box).classList.add('locked'); if(opts[ci])opts[ci].classList.add('ok');
    var msg=$('.q-msg',box);
    if(k===ci){score++;msg.textContent=T('correct');msg.className='q-msg ok';sound('ok');ctx.award(1);}
    else{if(k>=0)opts[k].classList.add('bad');msg.textContent=k<0?T('timeUp'):T('wrong');msg.className='q-msg bad';sound('bad');}
    $('[data-act=next]',box).hidden=false;
  }
  function nextQ(){i++;if(i>=qs.length)end();else ask();}
  function end(){
    phase='end'; stop();
    box.innerHTML='<div class="q-end"><div class="q-ico">'+icon('trophy')+'</div><div class="q-score">'+score+' / '+qs.length+'</div><div class="q-info">'+esc(T('result'))+'</div><button class="btn lg" data-act="restart">'+icon('reset')+esc(T('reset'))+'</button></div>';
    if(score===qs.length){confetti();sound('win');}
    ctx.report(score,qs.length);
  }
  box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('q-opt'))answer(+b.dataset.k);
    var a=b.dataset.act; if(a==='start'||a==='restart'){i=0;score=0;ask();} if(a==='next')nextQ();
  });
  viewStart();
  return {enter:function(){if(phase==='q')run();},leave:stop,next:function(){if(phase==='fb'){nextQ();return true;}return false;}};
};

/* ================= BATCH 2 ================= */
function toNum(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  var s=String(v==null?'':v).replace(/\s/g,'').replace(/[−–]/g,'-').replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):null;
}
function numStr(n){var s=String(Math.round(n*1e6)/1e6);if(S.lang!=='en')s=s.replace('.',',');return s.replace('-','−');}
function same(a,b){return norm(a).replace(/\s+/g,'')===norm(b).replace(/\s+/g,'');}
function bankHtml(words){return '<div class="bank">'+shuffle(words).map(function(w,k){return '<span class="chip" data-w="'+esc(norm(w))+'" data-k="'+k+'"><span>'+fmt(w)+'</span></span>';}).join('')+'</div>';}

/* Общая логика «слово → место» для fill и label */
function bindSlots(el,ctx){
  var bank=$('.bank',el), slots=$$('.slot',el), scored=false;
  function sortBank(){$$('.chip',bank).sort(function(a,b){return a.dataset.k-b.dataset.k;}).forEach(function(c){bank.appendChild(c);});}
  function clearMarks(){$$('.chip',el).forEach(function(c){c.classList.remove('ok','bad');});setStatus(el,'');}
  function refresh(){slots.forEach(function(s){s.classList.toggle('filled',!!$('.chip',s));});}
  function allToBank(){$$('.slot .chip',el).forEach(function(c){bank.appendChild(c);});sortBank();}
  pickPlace(el,{chip:'.chip',target:'.slot,.bank',place:function(c,t){
    var from=c.parentElement;
    if(t===bank){bank.appendChild(c);}
    else{var prev=$('.chip',t);if(prev&&prev!==c){if(from.classList.contains('slot'))from.appendChild(prev);else bank.appendChild(prev);}t.appendChild(c);}
    sortBank();refresh();clearMarks();sound('tick');
  }});
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check'){
      if(slots.some(function(s){return !$('.chip',s);})){toast(T('notDone'),'info');return;}
      var ok=0;slots.forEach(function(s){var c=$('.chip',s),g=c.dataset.w===s.dataset.ans;c.classList.toggle('ok',g);c.classList.toggle('bad',!g);if(g)ok++;});
      result(el,ctx,ok,slots.length,!scored);scored=true;
    }
    if(a==='show'){allToBank();slots.forEach(function(s){var c=$$('.chip',bank).filter(function(x){return x.dataset.w===s.dataset.ans;})[0];if(c){s.appendChild(c);c.classList.add('ok');}});refresh();setStatus(el,T('shown'),'ok');}
    if(a==='reset'){allToBank();refresh();clearMarks();scored=false;}
  });
}

/* 11. Словарь на 2–4 языках, с озвучкой и скрытием столбца */
var LANG_NAMES={kk:'Қазақша',ru:'Русский',en:'English',uz:'Oʻzbekcha'};
function speak(text,lang){
  try{
    var ss=window.speechSynthesis; if(!ss){toast(T('noVoice'),'info');return;}
    var v=ss.getVoices().filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf(lang)===0;})[0];
    if(!v){toast(T('noVoice'),'info');return;}
    ss.cancel(); var u=new SpeechSynthesisUtterance(text); u.voice=v; u.lang=v.lang; u.rate=0.85; ss.speak(u);
  }catch(e){toast(T('noVoice'),'info');}
}

/* 13. Сравнение — таблица 2–3 столбца */
TPL.compare=function(d,el){
  var cols=d.columns||[], rows=d.rows||[], hasL=rows.some(function(r){return r.label;});
  var h='<div class="cmp" style="grid-template-columns:'+(hasL?'minmax(220px,.7fr) ':'')+'repeat('+cols.length+',1fr)">'+(hasL?'<div></div>':'')+
    cols.map(function(c,i){return '<div class="cmp-h h'+i+'"><span>'+fmt(c)+'</span></div>';}).join('');

/* 15. График функции с ползунками параметров */
var FNS={sin:Math.sin,cos:Math.cos,tan:Math.tan,sqrt:Math.sqrt,abs:Math.abs,ln:Math.log,log:function(v){return Math.log(v)/Math.LN10;},exp:Math.exp};
var CONSTS={pi:Math.PI,e:Math.E};
function compileExpr(src,vars){
  var s=String(src).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[·×]/g,'*').replace(/π/g,'pi'), i=0, raw=[];
  while(i<s.length){
    var c=s[i], j;
    if(/[0-9.]/.test(c)){j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;raw.push({t:'n',v:parseFloat(s.slice(i,j))});i=j;}
    else if(/[a-zA-Z_]/.test(c)){j=i;while(j<s.length&&/[a-zA-Z0-9_]/.test(s[j]))j++;var id=s.slice(i,j);
      if(FNS[id]||vars.indexOf(id)>=0||id in CONSTS)raw.push({t:'id',v:id});
      else id.split('').forEach(function(ch){raw.push({t:'id',v:ch});});
      i=j;}
    else if('+-*/^()'.indexOf(c)>=0){raw.push({t:c});i++;}
    else throw new Error('bad char '+c);
  }
  var tk=[];
  raw.forEach(function(t){var p=tk[tk.length-1];
    if(p&&(p.t==='n'||p.t===')'||(p.t==='id'&&!FNS[p.v]))&&(t.t==='n'||t.t==='id'||t.t==='('))tk.push({t:'*'});
    tk.push(t);});
  var p=0;
  function eat(t){if(tk[p]&&tk[p].t===t){p++;return true;}return false;}
  function expr(){var a=term();for(;;){var l=a,r;if(eat('+')){r=term();a=(function(l,r){return function(e){return l(e)+r(e);};})(l,r);}else if(eat('-')){r=term();a=(function(l,r){return function(e){return l(e)-r(e);};})(l,r);}else return a;}}
  function term(){var a=unary();for(;;){var l=a,r;if(eat('*')){r=unary();a=(function(l,r){return function(e){return l(e)*r(e);};})(l,r);}else if(eat('/')){r=unary();a=(function(l,r){return function(e){return l(e)/r(e);};})(l,r);}else return a;}}
  function unary(){if(eat('-')){var r=unary();return function(e){return -r(e);};}if(eat('+'))return unary();return power();}
  function power(){var b=primary();if(eat('^')){var x=unary();return function(e){return Math.pow(b(e),x(e));};}return b;}
  function primary(){
    var t=tk[p++]; if(!t)throw new Error('end');
    if(t.t==='n')return function(){return t.v;};
    if(t.t==='('){var a=expr();if(!eat(')'))throw new Error(')');return a;}
    if(t.t==='id'){
      if(FNS[t.v]){if(!eat('('))throw new Error('(');var g=expr();if(!eat(')'))throw new Error(')');var f=FNS[t.v];return function(e){return f(g(e));};}
      if(vars.indexOf(t.v)>=0)return function(e){return e[t.v];};
      if(t.v in CONSTS){var k=CONSTS[t.v];return function(){return k;};}
      throw new Error('unknown '+t.v);
    }
    throw new Error('unexpected');
  }
  var fn=expr(); if(p<tk.length)throw new Error('trailing'); return fn;
}
function niceStep(r){var raw=r/10,pw=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),m=raw/pw;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*pw;}
TPL.graph=function(d,el){
  var params=(d.params||[]).map(function(q){return {name:q.name,min:+q.min,max:+q.max,step:+q.step||1,value:q.value!=null?+q.value:+q.min};});
  var names=params.map(function(q){return q.name;}).concat(['x']), f=null;
  try{f=compileExpr(d.fn||'x',names);}catch(err){console.error('graph fn',err);}
  var X=d.x||[-10,10], Y=d.y||[-10,10], VW=860, VH=640;
  el.innerHTML=head('graph','chart',false,params.length?hint('hintGraph'):'')+'<h2 class="s-title">'+fmt(d.title)+'</h2>'+
    '<div class="gr"><div class="gr-plot"><svg viewBox="0 0 '+VW+' '+VH+'"></svg></div><div class="gr-side">'+
    (d.tex?'<div class="gr-f">'+tex(d.tex,true)+'</div>':'')+
    params.map(function(q,i){return '<div class="gr-p"><div class="pl"><span>'+tex(q.name)+'</span><span class="pv" data-i="'+i+'"></span></div><input type="range" data-i="'+i+'" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+q.value+'"></div>';}).join('')+
    ((d.notes&&d.notes.length)?'<ul class="gr-notes">'+d.notes.map(function(t){return '<li><i></i><span>'+fmt(t)+'</span></li>';}).join('')+'</ul>':'')+'</div></div>';
  var svg=$('.gr-plot svg',el);
  function sx(x){return (x-X[0])/(X[1]-X[0])*VW;}
  function sy(y){return VH-(y-Y[0])/(Y[1]-Y[0])*VH;}
  function draw(){
    var g='', stx=niceStep(X[1]-X[0]), sty=niceStep(Y[1]-Y[0]), v;
    for(v=Math.ceil(X[0]/stx)*stx;v<=X[1]+1e-9;v+=stx)g+='<line class="gl" x1="'+sx(v)+'" y1="0" x2="'+sx(v)+'" y2="'+VH+'"/>';
    for(v=Math.ceil(Y[0]/sty)*sty;v<=Y[1]+1e-9;v+=sty)g+='<line class="gl" x1="0" y1="'+sy(v)+'" x2="'+VW+'" y2="'+sy(v)+'"/>';
    var ax=Math.max(0,Math.min(VH,sy(0))), ay=Math.max(0,Math.min(VW,sx(0)));
    g+='<line class="ga" x1="0" y1="'+ax+'" x2="'+VW+'" y2="'+ax+'"/><line class="ga" x1="'+ay+'" y1="0" x2="'+ay+'" y2="'+VH+'"/>';
    var lx=ax<VH-40?ax+30:ax-12;
    for(v=Math.ceil(X[0]/stx)*stx;v<=X[1]+1e-9;v+=stx){if(Math.abs(v)<1e-9||sx(v)<14||sx(v)>VW-14)continue;g+='<text class="gt" x="'+sx(v)+'" y="'+lx+'" text-anchor="middle">'+numStr(v)+'</text>';}
    var left=ay>60;
    for(v=Math.ceil(Y[0]/sty)*sty;v<=Y[1]+1e-9;v+=sty){if(Math.abs(v)<1e-9||sy(v)<14||sy(v)>VH-14)continue;g+='<text class="gt" x="'+(left?ay-10:ay+10)+'" y="'+(sy(v)+8)+'" text-anchor="'+(left?'end':'start')+'">'+numStr(v)+'</text>';}
    g+='<text class="gn" x="'+(VW-16)+'" y="'+(ax-14)+'" text-anchor="end">x</text><text class="gn" x="'+(ay+14)+'" y="30">y</text>';
    if(f){
      var vals={}, path='', pen=false, last=0, k;
      params.forEach(function(q){vals[q.name]=q.value;});
      for(k=0;k<=640;k++){
        var x=X[0]+(X[1]-X[0])*k/640, y; vals.x=x;
        try{y=f(vals);}catch(err){y=NaN;}
        if(!isFinite(y)){pen=false;continue;}
        var py=sy(y); if(py<-VH*3||py>VH*4){pen=false;continue;}
        if(pen&&Math.abs(py-last)>VH*1.5)pen=false;
        path+=(pen?'L':'M')+sx(x).toFixed(1)+' '+py.toFixed(1); pen=true; last=py;
      }
      g+='<path class="gc" d="'+path+'"/>';
    }
    svg.innerHTML=g;
  }
  function upd(){params.forEach(function(q,i){var pv=$('.pv[data-i="'+i+'"]',el);if(pv)pv.textContent=numStr(q.value);});draw();}
  el.addEventListener('input',function(e){var r=e.target.closest('input[type=range]');if(!r)return;params[+r.dataset.i].value=+r.value;upd();});
  upd();
  return {};
};

/* 16. Собери формулу — в tex пропуски [[...]] */
TPL.build=function(d,el,ctx){
  el.classList.add('game');
  var parts=String(d.tex||'').split(/\[\[(.+?)\]\]/), answers=[];
  parts.forEach(function(q,i){if(i%2)answers.push(q.trim());});
  var chips=shuffle(answers.concat(d.extra||[])).map(function(t,k){return {t:String(t).trim(),k:k};});
  var fill=answers.map(function(){return null;}), checked=false, scored=false;
  el.innerHTML=head('build','puzzle',true,hint('hintDrag'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+(d.text?'<p class="f-lead">'+fmt(d.text)+'</p>':'')+
    '<div class="b-formula"></div><div class="bank">'+chips.map(function(c){return '<span class="chip" data-k="'+c.k+'">'+tex(c.t)+'</span>';}).join('')+'</div>'+foot();
  var box=$('.b-formula',el);
  function texStr(){var j=-1;return parts.map(function(q,i){if(!(i%2))return q;j++;var c=fill[j];return '\\htmlData{slot='+j+'}{\\boxed{'+(c!=null?chips[c].t:'\\phantom{MM}')+'}}';}).join('');}
  function draw(){
    var html=null;
    if(window.katex){try{html=katex.renderToString(texStr(),{displayMode:true,throwOnError:true,strict:'ignore',trust:function(x){return x.command==='\\htmlData';}});}catch(err){html=null;}}
    if(html==null){var j=-1;html='<span class="tex-fb">'+parts.map(function(q,i){if(!(i%2))return esc(texFallback(q));j++;var c=fill[j];return '<span data-slot="'+j+'" class="fb-slot">'+(c!=null?esc(texFallback(chips[c].t)):'&nbsp;')+'</span>';}).join('')+'</span>';}
    box.innerHTML=html;
    $$('[data-slot]',box).forEach(function(s){var j=+s.dataset.slot,c=fill[j];s.classList.add('fslot');s.classList.toggle('empty',c==null);if(checked&&c!=null)s.classList.add(same(chips[c].t,answers[j])?'ok':'bad');});
    $$('.bank .chip',el).forEach(function(ch){ch.classList.toggle('used',fill.indexOf(+ch.dataset.k)>=0);});
  }
  function changed(){checked=false;setStatus(el,'');draw();sound('tick');}
  function slotAt(ev){var r=$$('.fslot',box).filter(function(s){var b=s.getBoundingClientRect();return ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom;});return r[0]||null;}
  pickPlace(el,{chip:'.bank .chip',target:'.fslot',hit:slotAt,place:function(c,t){var j=+t.dataset.slot,k=+c.dataset.k,o=fill.indexOf(k);if(o>=0)fill[o]=null;fill[j]=k;changed();}});
  box.addEventListener('click',function(e){if(el.classList.contains('picking'))return;var s=slotAt(e);if(!s)return;var j=+s.dataset.slot;if(fill[j]!=null){fill[j]=null;changed();}});
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check'){if(fill.some(function(c){return c==null;})){toast(T('notDone'),'info');return;}checked=true;draw();var ok=0;fill.forEach(function(c,j){if(same(chips[c].t,answers[j]))ok++;});result(el,ctx,ok,answers.length,!scored);scored=true;}
    if(a==='show'){var used=[];fill=answers.map(function(ans){var c=chips.filter(function(x){return same(x.t,ans)&&used.indexOf(x.k)<0;})[0];if(c){used.push(c.k);return c.k;}return null;});checked=true;draw();setStatus(el,T('shown'),'ok');}
    if(a==='reset'){fill=answers.map(function(){return null;});checked=false;scored=false;setStatus(el,'');draw();}
  });
  draw();
  return {};
};

/* 17. Введи ответ — числа (с экранной клавиатурой) или слова */
TPL.input=function(d,el,ctx){
  el.classList.add('game');

  function isNum(t){return [].concat(t.answer).every(function(a){return toNum(a)!==null;});}
  var anyNum=tasks.some(isNum), keys=['7','8','9','del','4','5','6','-','1','2','3',',','0','next'];

    '<div class="inw"><div class="in-list">'+tasks.map(function(t,i){return '<div class="in-row" data-i="'+i+'"><span class="n">'+(i+1)+'</span><div class="in-q">'+fmt(t.q)+'</div>'+
      (isNum(t)?'<div class="inp" data-i="'+i+'"></div>':'<input class="inp" data-i="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false">')+'<span class="in-u">'+fmt(t.unit||'')+'</span></div>';}).join('')+'</div>'+
    (anyNum?'<div class="keypad">'+keys.map(function(k){return '<button class="key'+(k==='0'||k==='next'?' wide':'')+(k==='next'?' go':'')+'" data-key="'+k+'">'+(k==='del'?icon('del'):k==='next'?icon('enter'):k==='-'?'−':k===','?(S.lang==='en'?'.':','):k)+'</button>';}).join('')+'</div>':'')+'</div>'+foot();
  var fields=$$('.inp',el);
  function val(f){return f.tagName==='INPUT'?f.value:f.textContent;}
  function clearMarks(){$$('.in-row',el).forEach(function(r){r.classList.remove('ok','bad');});setStatus(el,'');}
  function setAct(f){act=f||null;fields.forEach(function(x){x.classList.toggle('act',x===act);});if(act&&act.tagName==='INPUT')act.focus();else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
  function press(k){
    if(!act||act.tagName==='INPUT'){var nf=fields.filter(function(f){return f.tagName!=='INPUT';});if(!nf.length)return;if(!act||act.tagName==='INPUT')setAct(nf[0]);}
    var v=act.textContent;
    if(k==='next'){setAct(fields[fields.indexOf(act)+1]||null);return;}
    if(k==='del')v=v.slice(0,-1);
    else if(k==='-')v=v.charAt(0)==='−'?v.slice(1):'−'+v;
    else if(k===','||k==='.'){var sep=S.lang==='en'?'.':',';if(v.indexOf(sep)<0)v+=(v===''||v==='−'?'0':'')+sep;}

      if(fields.some(function(f){return !val(f).trim();})){toast(T('notDone'),'info');return;}
      var ok=0;
      tasks.forEach(function(t,i){var v=val(fields[i]),good;
        if(isNum(t)){var n=toNum(v);good=n!==null&&[].concat(t.answer).some(function(a){return Math.abs(n-toNum(a))<=(+t.tol||1e-9);});}
        else good=[].concat(t.answer).some(function(a){return norm(a)===norm(v);});

      setAct(null); result(el,ctx,ok,tasks.length,!scored); scored=true;
    }
    if(a==='show'){tasks.forEach(function(t,i){var a0=[].concat(t.answer)[0];if(fields[i].tagName==='INPUT')fields[i].value=a0;else fields[i].textContent=numStr(toNum(a0));$('.in-row[data-i="'+i+'"]',el).classList.add('ok');});setAct(null);setStatus(el,T('shown'),'ok');}
    if(a==='reset'){fields.forEach(function(f){if(f.tagName==='INPUT')f.value='';else f.textContent='';});clearMarks();setAct(null);scored=false;}
  });
  fields.forEach(function(f){if(f.tagName==='INPUT'){

  }});

    if(!el.isConnected||!el.classList.contains('active')||!act||act.tagName==='INPUT')return;
    var k=e.key, m=/^\d$/.test(k)?k:k==='Backspace'?'del':(k==='Enter'||k==='Tab')?'next':(k===','||k==='.')?',':k==='-'?'-':null;
    if(m){e.preventDefault();e.stopPropagation();press(m);}
  },true);
  return {leave:function(){setAct(null);}};
};

/* 20. Memory — открой две карточки, найди пару (в режиме команд ход переходит) */
TPL.memory=function(d,el,ctx){
  el.classList.add('game');
  var pairs=d.pairs||[], n=pairs.length*2, rows=n<=8?2:n<=12?3:4, cols=Math.ceil(n/rows);
  var open=[], lock=false, moves=0, found=0;
  el.innerHTML=head('memory','grid',true,hint('hintMemory'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+
    '<div class="mem" style="grid-template-columns:repeat('+cols+',1fr);grid-template-rows:repeat('+rows+',1fr)"></div>'+
    '<div class="g-foot"><div class="mem-stats"><span>'+esc(T('moves'))+': <b class="mv">0</b></span><span>'+esc(T('pairsFound'))+': <b class="pf">0</b> / '+pairs.length+'</span></div>'+
    '<button class="btn" data-act="show" style="margin-left:auto">'+icon('eye')+esc(T('openAll'))+'</button><button class="btn sq" data-act="reset" title="'+esc(T('reset'))+'">'+icon('reset')+'</button></div>';
  var grid=$('.mem',el);
  function stats(){$('.mv',el).textContent=moves;$('.pf',el).textContent=found;}
  function deal(){
    var cards=[]; pairs.forEach(function(q,i){cards.push({t:q[0],p:i});cards.push({t:q[1],p:i});});
    grid.innerHTML=shuffle(cards).map(function(c){return '<button class="mem-c" data-p="'+c.p+'"><span class="back">'+icon('help')+'</span><span class="face">'+fmt(c.t)+'</span></button>';}).join('');
    open=[];lock=false;moves=0;found=0;stats();
  }
  function flip(c,on){
    var a=c.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:110,easing:'ease-in'});
    a.onfinish=function(){c.classList.toggle('open',on);c.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:130,easing:'ease-out'});};
  }
  grid.addEventListener('click',function(e){
    var c=e.target.closest('.mem-c'); if(!c||lock||c.classList.contains('done')||open.indexOf(c)>=0)return;
    flip(c,true); open.push(c); sound('tick');
    if(open.length<2)return;
    moves++; stats(); var a=open[0], b=open[1]; open=[];
    if(a.dataset.p===b.dataset.p){
      found++; stats(); setTimeout(function(){a.classList.add('done');b.classList.add('done');sound('ok');},280); ctx.award(1);
      if(found===pairs.length)setTimeout(function(){toast(T('allCorrect'),'ok');sound('win');confetti();ctx.report(found,pairs.length);},600);
    }else{
      lock=true; setTimeout(function(){flip(a,false);flip(b,false);lock=false;ctx.switchTeam();},1100);
    }
  });
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='show'){$$('.mem-c',grid).forEach(function(c){c.classList.add('open','done');});open=[];}
    if(b.dataset.act==='reset')deal();
  });

/* 21. Процесс / цикл (cycle:false — цепочка слева направо) */
TPL.process=function(d,el){
  var st=d.steps||[], n=st.length, cyc=d.cycle!==false, mid='prm'+(++UID);
  var nodes=st.map(function(s,i){return '<div class="pr-node" data-k="'+i+'"><span class="n">'+(i+1)+'</span><div><b>'+fmt(s.title)+'</b>'+(s.text?'<span class="tx">'+fmt(s.text)+'</span>':'')+'</div></div>';});
  var body=cyc?
    '<div class="pr cyc"><svg class="pr-arrows"><defs><marker id="'+mid+'" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B0B0C"/></marker></defs><g></g></svg><div class="pr-center">'+(d.center?fmt(d.center):icon('cycle'))+'</div>'+nodes.join('')+'</div>':
    '<div class="pr lin">'+nodes.map(function(h,i){return h+(i<n-1?'<div class="pr-arr" data-k="'+(i+1)+'">'+icon('arrow')+'</div>':'');}).join('')+'</div>';
  el.innerHTML=head('process','cycle',false,d.writeDown===false?'':writeBadge())+'<h2 class="s-title">'+fmt(d.title)+'</h2>'+body;
  var pr=$('.pr',el), k=d.reveal?0:n;
  function upd(){$$('[data-k]',el).forEach(function(x){x.classList.toggle('hide',+x.dataset.k>=k);});}
  function layout(){
    if(!cyc){upd();return;}
    var W=pr.clientWidth,H=pr.clientHeight; if(!W||!H)return;
    var ns=$$('.pr-node',pr), rx=W/2-205, ry=H/2-Math.max.apply(null,ns.map(function(x){return x.offsetHeight;}))/2-6, R=[];
    ns.forEach(function(nd,i){var a=-Math.PI/2+i*2*Math.PI/n,x=W/2+rx*Math.cos(a),y=H/2+ry*Math.sin(a);nd.style.left=x+'px';nd.style.top=y+'px';R.push({x:x,y:y,w:nd.offsetWidth/2+16,h:nd.offsetHeight/2+16});});
    var svg=$('svg',pr), g=''; svg.setAttribute('viewBox','0 0 '+W+' '+H);
    for(var i=0;i<n;i++){
      var j=(i+1)%n, a0=-Math.PI/2+i*2*Math.PI/n, pts=[];
      for(var s=0;s<=90;s++){var a=a0+(2*Math.PI/n)*s/90,x=W/2+rx*Math.cos(a),y=H/2+ry*Math.sin(a);
        if(!(Math.abs(x-R[i].x)<R[i].w&&Math.abs(y-R[i].y)<R[i].h)&&!(Math.abs(x-R[j].x)<R[j].w&&Math.abs(y-R[j].y)<R[j].h))pts.push(x.toFixed(1)+' '+y.toFixed(1));}
      if(pts.length>1)g+='<path data-k="'+(j===0?n-1:j)+'" d="M'+pts.join(' L')+'" marker-end="url(#'+mid+')"/>';
    }
    $('g',svg).innerHTML=g; upd();
  }
  layout();
  return {enter:layout,layout:layout,next:function(){if(k<n){k++;upd();sound('tick');return true;}return false;}};
};

/* 24. Код: программа проходится по строкам с объяснением и выводом */
var PYK=['False','None','True','and','as','break','class','continue','def','elif','else','except','for','from','if','import','in','is','lambda','not','or','pass','return','try','while','with','yield'];
var PYB=['print','range','len','input','int','str','float','list','dict','set','sum','min','max','abs','round','sorted','enumerate','type','bool'];
function hlPy(line){
  var out='', re=/(#.*$)|("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_\u0400-\u04FF][A-Za-z0-9_\u0400-\u04FF]*)|(\s+)|(.)/g, m;
  while((m=re.exec(line))){
    if(m[1])out+='<span class="tk-c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="tk-s">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="tk-n">'+m[3]+'</span>';
    else if(m[4])out+=PYK.indexOf(m[4])>=0?'<span class="tk-k">'+m[4]+'</span>':PYB.indexOf(m[4])>=0?'<span class="tk-b">'+m[4]+'</span>':esc(m[4]);
    else out+=esc(m[0]);
  }
  return out||' ';
}

/* 26. Карточки-перевёртыши: «Знаю» убирает карточку, «Повторить» — в конец */
TPL.flash=function(d,el){

      '<button class="fl-card'+(side?' back':'')+'"><span>'+fmt(side?c.b:c.f)+'</span><span class="turn">'+icon('cycle')+'</span></button>'+
      '<div class="fl-btns"><button class="btn bad-b" data-act="again">'+icon('reset')+esc(T('again'))+'</button><button class="btn good-b" data-act="know">'+icon('check')+esc(T('know'))+'</button></div>';
  }

    var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;

/* 27. Верно или нет — на скорость (общий таймер) */
TPL.speed=function(d,el,ctx){
  el.classList.add('game');

  el.innerHTML=head('speed','zap',true)+'<div class="sp"></div>';
  var box=$('.sp',el);

  function tick(){var now=performance.now();left-=(now-last)/1000;last=now;if(left<=0){left=0;end();return;}bar();}
  function bar(){var b=$('.q-timer',box);if(!b)return;b.firstChild.style.width=(left/total*100)+'%';b.classList.toggle('low',left<=10);$('.q-sec',box).textContent=Math.ceil(left);}
  function viewStart(){phase='start';stop();box.innerHTML='<div class="q-start"><div class="q-ico">'+icon('zap')+'</div><div class="q-big">'+fmt(d.title||T('speed'))+'</div><div class="q-info">'+total+' '+esc(T('speedInfo'))+'</div><button class="btn primary lg" data-act="start">'+icon('play')+esc(T('start'))+'</button></div>';}
  function start(){
    phase='run';left=total;score=0;done=0;lock=false;q=shuffle(items);
    box.innerHTML='<div class="q-head"><span class="q-num">'+esc(T('score'))+': <b class="sp-sc">0</b></span><div class="q-timer"><i></i></div><span class="q-sec">'+total+'</span></div>'+
      '<div class="sp-card"></div><div class="sp-btns"><button class="sp-btn no" data-v="0">'+icon('x')+esc(T('no'))+'</button><button class="sp-btn yes" data-v="1">'+icon('check')+esc(T('yes'))+'</button></div>';
    nextItem();run();
  }
  function nextItem(){if(!q.length){end();return;}cur=q.shift();var c=$('.sp-card',box);c.className='sp-card';c.innerHTML='<span>'+fmt(cur.t)+'</span>';}
  function answer(v){

    if(ok){score++;ctx.award(1);$('.sp-sc',box).textContent=score;}
    setTimeout(function(){lock=false;if(phase==='run')nextItem();},450);
  }
  function end(){phase='end';stop();box.innerHTML=endScreen(score,done).replace('data-act="restart"','data-act="start"');if(done&&score===done){confetti();sound('win');}ctx.report(score,done);}
  box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.act==='start')start();if(b.dataset.v!=null)answer(b.dataset.v==='1');});

TPL.odd=function(d,el,ctx){

    box.innerHTML='<div class="q-num od-n">'+esc(T('round'))+' '+(r+1)+' / '+rounds.length+'</div>'+
      '<div class="od-grid" style="grid-template-columns:repeat('+Math.min(order.length,4)+',1fr)">'+order.map(function(o){return '<button class="od-t" data-i="'+o.i+'"><span>'+fmt(o.t)+'</span></button>';}).join('')+'</div>'+
      '<div class="od-why remember" hidden></div><div class="q-fb"><span class="q-msg"></span><button class="btn primary" data-act="next" hidden>'+esc(T(r===rounds.length-1?'result':'next'))+icon('right')+'</button></div>';
  }
  box.addEventListener('click',function(e){
    var t=e.target.closest('.od-t');

      if(solved)return; var R=rounds[r];
      if(+t.dataset.i===+R.odd){
        solved=true; t.classList.add('right'); $$('.od-t',box).forEach(function(x){x.classList.remove('nope');if(x!==t)x.classList.add('dim');});
        var pts=tries===0?1:0; score+=pts; ctx.award(pts); sound('ok');

/* 30. Уравняй реакцию: коэффициенты + живая таблица атомов */
function atoms(f){
  var s=String(f).replace(/\s+/g,'').replace(/\^$/,''), i=0;
  function num(){var j=i;while(i<s.length&&/\d/.test(s[i]))i++;return j===i?1:parseInt(s.slice(j,i),10);}
  function group(){var m={};while(i<s.length){var c=s[i];
    if(c==='('||c==='['){i++;var g=group();i++;var n=num();for(var k in g)m[k]=(m[k]||0)+g[k]*n;}
    else if(c===')'||c===']')return m;
    else if(/[A-Z]/.test(c)){var e=c;i++;while(i<s.length&&/[a-z]/.test(s[i])){e+=s[i];i++;}var q=num();m[e]=(m[e]||0)+q;}
    else i++;}
    return m;}
  return group();
}

/* 36. Кроссворд — сетка строится автоматически из слов */
function cwBox(pl){var r0=1e9,c0=1e9,r1=-1e9,c1=-1e9;pl.forEach(function(o){var L=o.W.length;r0=Math.min(r0,o.r);c0=Math.min(c0,o.c);r1=Math.max(r1,o.r+o.dir*(L-1));c1=Math.max(c1,o.c+(1-o.dir)*(L-1));});return {r0:r0,c0:c0,h:r1-r0+1,w:c1-c0+1};}
function genCross(list){
  var best=null;
  for(var att=0;att<40;att++){
    var ws=att===0?list.slice().sort(function(a,b){return b.W.length-a.W.length;}):shuffle(list);
    var grid={}, dirs={}, placed=[];
    var at=function(r,c){return grid[r+','+c];};
    var can=function(w,r,c,dir){var dr=dir,dc=1-dir,inter=0;
      if(at(r-dr,c-dc)||at(r+dr*w.length,c+dc*w.length))return -1;
      for(var i=0;i<w.length;i++){var rr=r+dr*i,cc=c+dc*i,key=rr+','+cc,g=grid[key];
        if(g){if(g!==w[i]||(dirs[key]&(1<<dir)))return -1;inter++;}
        else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr))return -1;}
      return inter;};
    var put=function(o){for(var i=0;i<o.W.length;i++){var key=(o.r+o.dir*i)+','+(o.c+(1-o.dir)*i);grid[key]=o.W[i];dirs[key]=(dirs[key]||0)|(1<<o.dir);}placed.push(o);};
    ws.forEach(function(it){
      var w=it.W;
      if(!placed.length){put({W:w,r:0,c:0,dir:0,it:it});return;}
      var cands=[];
      Object.keys(grid).forEach(function(key){var p=key.split(','),r=+p[0],c=+p[1];
        for(var i=0;i<w.length;i++){if(w[i]!==grid[key])continue;
          for(var dir=0;dir<2;dir++){if(dirs[key]&(1<<dir))continue;var r0=r-dir*i,c0=c-(1-dir)*i,x=can(w,r0,c0,dir);if(x>0)cands.push({r:r0,c:c0,dir:dir,x:x});}}});
      if(!cands.length)return;
      cands.forEach(function(o){var b=cwBox(placed.concat([{W:w,r:o.r,c:o.c,dir:o.dir}]));o.s=o.x*12-b.w*b.h/8-Math.abs(b.w/b.h-1.35)*6;});
      cands.sort(function(a,b){return b.s-a.s;}); var o=cands[0]; put({W:w,r:o.r,c:o.c,dir:o.dir,it:it});
    });
    var b=cwBox(placed), score=placed.length*1000-b.w*b.h-Math.abs(b.w/b.h-1.35)*20;
    if(!best||score>best.score)best={placed:placed,b:b,score:score};
  }
  return best;
}

/* 37. Филворд: найди слова в сетке */
TPL.wordsearch=function(d,el,ctx){
  el.classList.add('game');
  var words=(d.words||[]).map(function(w){return Array.from(String(w).toUpperCase().replace(/[\s\-]/g,'')).join('');});
  var size=Math.min(12,Math.max(8,+d.size||0,Math.max.apply(null,words.map(function(w){return Array.from(w).length;}).concat([6]))+2));
  var DIRS=[[0,1],[1,0]].concat(d.diagonal?[[1,1]]:[]), grid=[], found=[], start=null;

    for(var att=0;att<80;att++){
      grid=[];for(var r=0;r<size;r++){var row=[];for(var c=0;c<size;c++)row.push('');grid.push(row);}
      var ok=words.every(function(w){var L=Array.from(w);
        for(var t=0;t<300;t++){var dd=DIRS[Math.floor(Math.random()*DIRS.length)],r0=Math.floor(Math.random()*size),c0=Math.floor(Math.random()*size);
          if(r0+dd[0]*(L.length-1)>=size||c0+dd[1]*(L.length-1)>=size)continue;
          var fit=L.every(function(ch,i){var g=grid[r0+dd[0]*i][c0+dd[1]*i];return !g||g===ch;});
          if(!fit)continue; L.forEach(function(ch,i){grid[r0+dd[0]*i][c0+dd[1]*i]=ch;}); return true;}
        return false;});
      if(ok)break;
    }
    var A=Array.from(alphaFor(words,d.lang||S.lang)), pool=Array.from(words.join(''));
    for(var r2=0;r2<size;r2++)for(var c2=0;c2<size;c2++)if(!grid[r2][c2])grid[r2][c2]=Math.random()<.5?pool[Math.floor(Math.random()*pool.length)]:A[Math.floor(Math.random()*A.length)];
  }

  el.innerHTML=head('wordsearch','scan',true,hint('hintWS'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+
    '<div class="ws"><div class="ws-grid" style="--cs:'+cs+'px;--fs:'+Math.round(cs*.56)+'px;grid-template-columns:repeat('+size+','+cs+'px)"></div>'+
    '<div class="ws-side"><div class="ws-st">'+esc(T('found'))+': <b class="ws-n">0</b> / '+words.length+'</div><div class="ws-list">'+words.map(function(w,i){return '<span class="ws-w" data-i="'+i+'">'+esc(w)+'</span>';}).join('')+'</div>'+
    '<div class="g-foot" style="padding-top:8px"><button class="btn" data-act="show">'+icon('eye')+esc(T('showAnswer'))+'</button><button class="btn sq" data-act="reset" title="'+esc(T('reset'))+'">'+icon('reset')+'</button></div></div></div>';
  var gEl=$('.ws-grid',el);
  function render(){gEl.innerHTML=grid.map(function(row,r){return row.map(function(ch,c){return '<div class="ws-c" data-r="'+r+'" data-c="'+c+'">'+esc(ch)+'</div>';}).join('');}).join('');found=[];start=null;stats();}
  function cell(r,c){return $('.ws-c[data-r="'+r+'"][data-c="'+c+'"]',gEl);}
  function path(a,b){var dr=b.r-a.r,dc=b.c-a.c;if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc)))return null;var n=Math.max(Math.abs(dr),Math.abs(dc)),sr=Math.sign(dr),sc=Math.sign(dc),p=[];for(var i=0;i<=n;i++)p.push({r:a.r+sr*i,c:a.c+sc*i});return p;}
  function mark(p,cls){$$('.ws-c.'+cls,gEl).forEach(function(x){x.classList.remove(cls);});if(p)p.forEach(function(q){var x=cell(q.r,q.c);if(x)x.classList.add(cls);});}
  function stats(){$('.ws-n',el).textContent=found.length;$$('.ws-w',el).forEach(function(x){x.classList.toggle('found',found.indexOf(+x.dataset.i)>=0);});}
  function tryPath(p){
    mark(null,'cur'); if(!p||p.length<2)return;
    var s=p.map(function(q){return grid[q.r][q.c];}).join(''), rev=Array.from(s).reverse().join(''), i=-1;
    words.forEach(function(w,k){if(i<0&&found.indexOf(k)<0&&(w===s||w===rev))i=k;});
    if(i>=0){found.push(i);p.forEach(function(q){cell(q.r,q.c).classList.add('f');});sound('ok');ctx.award(1);stats();
      if(found.length===words.length){toast(T('allCorrect'),'ok');sound('win');confetti();ctx.report(found.length,words.length);}}
    else{p.forEach(function(q){var x=cell(q.r,q.c);x.classList.add('miss');setTimeout(function(){x.classList.remove('miss');},400);});sound('bad');}

  gEl.addEventListener('pointerdown',function(e){
    var a=at(e); if(!a)return; e.preventDefault(); try{gEl.setPointerCapture(e.pointerId);}catch(_){}
    var moved=false, last=a;
    function mv(ev){var b=at(ev);if(!b)return;if(b.r!==a.r||b.c!==a.c)moved=true;last=b;mark(path(a,b),'cur');}
    function up(){gEl.removeEventListener('pointermove',mv);gEl.removeEventListener('pointerup',up);gEl.removeEventListener('pointercancel',up);

    if(b.dataset.act==='show'){
      words.forEach(function(w,k){if(found.indexOf(k)>=0)return;var L=Array.from(w);
        for(var r=0;r<size;r++)for(var c=0;c<size;c++)DIRS.forEach(function(dd){if(found.indexOf(k)>=0)return;var ok=L.every(function(ch,i){var rr=r+dd[0]*i,cc=c+dd[1]*i;return rr<size&&cc<size&&grid[rr][cc]===ch;});
          if(ok){found.push(k);L.forEach(function(_,i){cell(r+dd[0]*i,c+dd[1]*i).classList.add('f');});}});});
      stats();
    }

      '<div class="gs-lives">'+Array.apply(null,{length:lives0}).map(function(_,i){return '<i class="'+(i<lives?'':'off')+'"></i>';}).join('')+'</div>'+
      '<div class="gs-kb">'+rows.map(function(row){return '<div class="gs-row">'+row.map(function(ch){var t=tried.indexOf(ch)>=0;return '<button class="gs-k'+(t?(w.indexOf(ch)>=0?' ok':' no'):'')+'" data-ch="'+esc(ch)+'"'+(t||over?' disabled':'')+'>'+esc(ch)+'</button>';}).join('')+'</div>';}).join('')+'</div>';

/* 42. Геометрия: фигура рисуется точно по размерам, ползунки меняют размеры, формулы считаются */
TPL.geometry=function(d,el){

  var params=(d.params||[]).map(function(q){return {name:q.name,min:+q.min,max:+q.max,step:+q.step||1,value:q.value!=null?+q.value:+q.min};});

  res.forEach(function(x){try{rfns.push(compileExpr(x.calc,names.slice()));}catch(e){rfns.push(null);}names.push(x.name);});
  function P(v){var g=function(k,def){return v[k]!=null?v[k]:def;};var a=g('a',4),b=g('b',3),h=g('h',3),r=g('r',3),o={};
    if(shape==='right-triangle'){o.pts=[[0,0],[a,0],[0,b]];o.sides=['a','c','b'];o.ra=0;}
    else if(shape==='triangle'){var p=a*.35;o.pts=[[0,0],[a,0],[p,h]];o.sides=['a','b','c'];o.h=[[p,h],[p,0]];}
    else if(shape==='square'){o.pts=[[0,0],[a,0],[a,a],[0,a]];o.sides=['a','a','',''];o.ra=0;}
    else if(shape==='parallelogram'){var s=a*.3;o.pts=[[0,0],[a,0],[a+s,h],[s,h]];o.sides=['a','b','',''];o.h=[[s,h],[s,0]];}
    else if(shape==='trapezoid'){var x0=(a-b)/2;o.pts=[[0,0],[a,0],[x0+b,h],[x0,h]];o.sides=['a','','b',''];o.h=[[x0,h],[x0,0]];}
    else if(shape==='circle'){o.circle=r;}
    else{o.pts=[[0,0],[a,0],[a,b],[0,b]];o.sides=['a','b','',''];o.ra=0;}
    if(d.labels)o.sides=d.labels; return o;}
  function bb(o){if(o.circle!=null)return {x0:-o.circle,y0:-o.circle,x1:o.circle,y1:o.circle};var xs=o.pts.map(function(p){return p[0];}),ys=o.pts.map(function(p){return p[1];});return {x0:Math.min.apply(null,xs),y0:Math.min.apply(null,ys),x1:Math.max.apply(null,xs),y1:Math.max.apply(null,ys)};}
  var mx={}; params.forEach(function(q){mx[q.name]=q.max;}); var B0=bb(P(mx)), K=Math.min(540/Math.max(B0.x1-B0.x0,1e-6),380/Math.max(B0.y1-B0.y0,1e-6));
  el.innerHTML=head('geometry','geo',false,params.length?hint('hintGraph'):'')+'<h2 class="s-title">'+fmt(d.title)+'</h2>'+
    '<div class="gm"><div class="gm-plot"><svg viewBox="0 0 '+VW+' '+VH+'"></svg></div><div class="gm-side">'+
    ((d.formulas&&d.formulas.length)?'<div class="gm-f">'+d.formulas.map(function(f){return '<div>'+tex(f)+'</div>';}).join('')+'</div>':'')+
    params.map(function(q,i){return '<div class="gr-p"><div class="pl"><span>'+tex(q.name)+'</span><span class="pv" data-i="'+i+'"></span></div><input type="range" data-i="'+i+'" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+q.value+'"></div>';}).join('')+
    '<div class="gm-res">'+res.map(function(x,i){return '<div class="gm-r"><span>'+tex(x.tex||x.name)+'</span><span><b data-i="'+i+'"></b><small>'+fmt(x.unit||'')+'</small></span></div>';}).join('')+'</div></div></div>';
  var svg=$('.gm-plot svg',el);
  function draw(){
    var v={}; params.forEach(function(q){v[q.name]=q.value;});
    res.forEach(function(x,i){var y=NaN;try{if(rfns[i])y=rfns[i](v);}catch(e){}v[x.name]=y;var b=$('.gm-r b[data-i="'+i+'"]',el);if(b)b.textContent=isFinite(y)?numStr(r2(y)):'—';});
    params.forEach(function(q,i){var pv=$('.pv[data-i="'+i+'"]',el);if(pv)pv.textContent=numStr(q.value);});
    var o=P(v), B=bb(o), cx=VW/2, cy=VH/2, mxx=(B.x0+B.x1)/2, myy=(B.y0+B.y1)/2;
    function X(x){return cx+(x-mxx)*K;} function Y(y){return cy-(y-myy)*K;}
    var g='';
    if(o.circle!=null){var R=o.circle*K;g+='<circle class="sh" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/><line class="hl" style="stroke-dasharray:none" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'"/><circle class="dt" cx="'+cx+'" cy="'+cy+'" r="7"/><text class="lb" x="'+(cx+R/2)+'" y="'+(cy-16)+'" text-anchor="middle">'+esc((d.labels||['r'])[0])+'</text>';}
    else{
      var px=o.pts.map(function(p){return [X(p[0]),Y(p[1])];}), gx=0, gy=0; px.forEach(function(p){gx+=p[0];gy+=p[1];}); gx/=px.length; gy/=px.length;
      g+='<polygon class="sh" points="'+px.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
      if(o.h){var h0=[X(o.h[0][0]),Y(o.h[0][1])],h1=[X(o.h[1][0]),Y(o.h[1][1])];g+='<line class="hl" x1="'+h0[0]+'" y1="'+h0[1]+'" x2="'+h1[0]+'" y2="'+h1[1]+'"/><path class="ra" d="M'+(h1[0]+18)+' '+h1[1]+'V'+(h1[1]-18)+'H'+h1[0]+'"/><text class="lb" x="'+(h1[0]+16)+'" y="'+((h0[1]+h1[1])/2+14)+'">h</text>';}
      if(o.ra!=null){var A=px[o.ra],P1=px[(o.ra+1)%px.length],P2=px[(o.ra+px.length-1)%px.length],s=24;
        var u=[(P1[0]-A[0]),(P1[1]-A[1])],w=[(P2[0]-A[0]),(P2[1]-A[1])],lu=Math.hypot(u[0],u[1]),lw=Math.hypot(w[0],w[1]);u=[u[0]/lu*s,u[1]/lu*s];w=[w[0]/lw*s,w[1]/lw*s];

      px.forEach(function(p,i){var lab=(o.sides||[])[i];if(!lab)return;var q=px[(i+1)%px.length],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,nx=-(q[1]-p[1]),ny=q[0]-p[0],ln=Math.hypot(nx,ny)||1;nx/=ln;ny/=ln;if((mx-gx)*nx+(my-gy)*ny<0){nx=-nx;ny=-ny;}
        g+='<text class="lb" x="'+(mx+nx*40).toFixed(1)+'" y="'+(my+ny*40+14).toFixed(1)+'" text-anchor="middle">'+esc(lab)+'</text>';});

/* 47. Составь предложение из слов (языки, определения, пословицы) */
TPL.sentence=function(d,el,ctx){
  el.classList.add('game');
  var items=(d.items||[]).map(function(x){return typeof x==='string'?{s:x}:x;}), r=0, score=0, line=[], bank=[], solved=false, hints=0;
  el.innerHTML=head('sentence','text',true,hint('hintSentence'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+'<div class="sn"></div>'+
    '<div class="g-foot"><span class="q-num sn-n"></span><button class="btn" data-act="hint" style="margin-left:auto">'+icon('bulb')+esc(T('hintBtn'))+'</button><button class="btn primary" data-act="next" hidden>'+esc(T('next'))+icon('right')+'</button></div>';
  var box=$('.sn',el), bHint=$('[data-act=hint]',el), bNext=$('[data-act=next]',el), nEl=$('.sn-n',el);
  function words(){return String(items[r].s).trim().split(/\s+/);}
  function setup(){
    if(r>=items.length){box.innerHTML=endScreen(score,items.length);bHint.hidden=true;bNext.hidden=true;nEl.textContent='';if(score===items.length){confetti();sound('win');}ctx.report(score,items.length);return;}
    var W=words(), p=perm(W.length); bank=p.map(function(i){return {w:W[i],i:i};}); line=[]; solved=false; hints=0; render();
  }
  function render(){
    box.innerHTML=(items[r].hint?'<div class="sn-hint">'+fmt(items[r].hint)+'</div>':'')+
      '<div class="sn-line'+(solved?' ok':'')+'">'+line.map(function(t,k){return '<span class="chip" data-l="'+k+'"><span>'+fmt(t.w)+'</span></span>';}).join('')+'</div>'+
      '<div class="sn-bank">'+bank.map(function(t,k){return '<span class="chip" data-b="'+k+'"><span>'+fmt(t.w)+'</span></span>';}).join('')+'</div>';
    nEl.textContent=T('round')+' '+(r+1)+' / '+items.length; bNext.hidden=!solved; bHint.hidden=solved;
  }
  function check(){
    if(bank.length)return;
    var ok=line.map(function(t){return t.w;}).join(' ')===words().join(' ');
    if(ok){solved=true;var pts=hints===0?1:0;score+=pts;ctx.award(pts);sound('win');toast(T('correct'),'ok');render();}
    else{var l=$('.sn-line',box);l.classList.remove('bad');void l.offsetWidth;l.classList.add('bad');sound('bad');}
  }
  box.addEventListener('click',function(e){
    if(e.target.closest('[data-act=restart]')){r=0;score=0;setup();return;}
    if(solved)return;
    var b=e.target.closest('[data-b]'); if(b){line.push(bank.splice(+b.dataset.b,1)[0]);sound('tick');render();check();return;}
    var l=e.target.closest('[data-l]'); if(l){bank.push(line.splice(+l.dataset.l,1)[0]);render();}
  });
  bHint.addEventListener('click',function(){
    var W=words(), k=0; while(k<line.length&&line[k].w===W[k])k++;
    bank=bank.concat(line.splice(k)); var j=-1; bank.forEach(function(t,x){if(j<0&&t.w===W[k])j=x;});
    if(j>=0)line.push(bank.splice(j,1)[0]); hints++; sound('tick'); render(); check();
  });
  bNext.addEventListener('click',function(){r++;setup();});
  setup();
  return {next:function(){if(solved&&r<items.length){r++;setup();return true;}return false;}};
};

  function shapeBg(type){if(type==='io')return '<svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M12 2H98L88 98H2Z"/></svg>';if(type==='decision')return '<svg class="bg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 2L98 50L50 98L2 50Z"/></svg>';return '';}
  var html='', side=null;

/* 50. Финальный тест: навигация по вопросам, итог в процентах, разбор */
TPL.test=function(d,el,ctx){
  el.classList.add('game');
  var qs=d.questions||[], ans=qs.map(function(){return null;}), cur=0, done=false;
  el.innerHTML=head('test','checks',true)+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+'<div class="ts"></div>';
  var box=$('.ts',el);
  function nav(){return '<div class="ts-nav">'+qs.map(function(_,i){var c='';if(done)c=ans[i]===qs[i].answer?' ok':' bad';else if(ans[i]!=null)c=' done';return '<button class="ts-dot'+c+(i===cur?' cur':'')+'" data-go="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>';}
  function q(){var Q=qs[cur];return '<div class="q-q">'+fmt(Q.q)+'</div><div class="q-opts'+(Q.options.length===2?' two':'')+'">'+Q.options.map(function(o,k){return '<button class="q-opt'+(ans[cur]===k?' sel':'')+'" data-k="'+k+'"><span class="L">'+('ABCDEF'[k]||k+1)+'</span><span>'+fmt(o)+'</span></button>';}).join('')+'</div>';}
  function render(){
    if(!done){
      box.innerHTML=nav()+q()+'<div class="ts-foot"><button class="btn sq" data-act="prev"'+(cur?'':' disabled')+'>'+icon('left')+'</button><button class="btn sq" data-act="nextq"'+(cur<qs.length-1?'':' disabled')+'>'+icon('right')+'</button><span class="sp"></span><span class="q-num">'+esc(T('answered'))+': '+ans.filter(function(a){return a!=null;}).length+' / '+qs.length+'</span><button class="btn primary" data-act="finish">'+icon('check')+esc(T('finish'))+'</button></div>';
      return;
    }
    var ok=qs.filter(function(Q,i){return ans[i]===Q.answer;}).length, pc=Math.round(ok/qs.length*100), C=2*Math.PI*143, Q=qs[cur];
    box.innerHTML=nav()+'<div class="ts-res"><div class="ts-pc"><svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="143" style="stroke:#ECECE6"/><circle cx="160" cy="160" r="143" style="stroke:var(--acc)" stroke-dasharray="'+(C*pc/100)+' '+C+'" stroke-linecap="round"/></svg><div><b>'+pc+'%</b><span>'+ok+' / '+qs.length+'</span></div></div>'+
      '<div class="ts-rv"><span class="lbl">'+esc(T('reviewHint'))+'</span><div class="q">'+(cur+1)+'. '+fmt(Q.q)+'</div>'+
      (ans[cur]!=null&&ans[cur]!==Q.answer?'<div class="a bad">'+icon('x')+' '+fmt(Q.options[ans[cur]])+'</div>':'')+'<div class="a ok">'+icon('check')+' '+fmt(Q.options[Q.answer])+'</div>'+
      '<div><button class="btn" data-act="restart">'+icon('reset')+esc(T('reset'))+'</button></div></div></div>';
  }
  box.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){cur=+g.dataset.go;render();return;}
    var o=e.target.closest('.q-opt'); if(o&&!done){ans[cur]=+o.dataset.k;sound('tick');if(cur<qs.length-1)setTimeout(function(){cur++;render();},250);render();return;}
    var b=e.target.closest('[data-act]'); if(!b)return; var a=b.dataset.act;
    if(a==='prev'&&cur>0){cur--;render();}
    if(a==='nextq'&&cur<qs.length-1){cur++;render();}
    if(a==='finish'){done=true;cur=0;var ok=qs.filter(function(Q,i){return ans[i]===Q.answer;}).length;render();sound(ok===qs.length?'win':'ok');if(ok===qs.length)confetti();ctx.award(ok);ctx.report(ok,qs.length);post({type:'testAnswers',slide:S.idx,answers:ans.slice()});}
    if(a==='restart'){ans=qs.map(function(){return null;});cur=0;done=false;render();}
  });
  render();
  return {};
};

/* ================= CODE (informatics) ================= */
function codeLines(code,lang,mapLine){
  var py=(lang||'python')==='python';
  return String(code||'').replace(/\t/g,'    ').split('\n').map(function(l,i){
    var inner=mapLine?mapLine(l,py):(py?hlPy(l):esc(l)||' ');
    return '<div class="cd-line"><span class="ln">'+(i+1)+'</span><span>'+inner+'</span></div>';}).join('');
}
function outNorm(s){return String(s==null?'':s).replace(/\r/g,'').split('\n').map(function(l){return l.trim().replace(/\s+/g,' ');}).filter(function(l){return l!=='';}).join('\n').toLowerCase();}

/* 51. Что выведет программа */
TPL.predict=function(d,el,ctx){
  el.classList.add('game');
  var answers=[].concat(d.answer!=null?d.answer:[]), scored=false;
  el.innerHTML=head('predict','code',true,hint('hintPredict'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+
    '<div class="pd"><div class="cd-code">'+codeLines(d.code,d.language)+'</div>'+
    '<div class="pd-side">'+(d.question?'<div class="cd-exp" style="flex:none">'+fmt(d.question)+'</div>':'')+
    '<span class="lbl">'+esc(T('yourOutput'))+'</span><textarea class="pd-in" rows="2" spellcheck="false" autocomplete="off"></textarea>'+foot()+'</div></div>';
  var inp=$('.pd-in',el);
  function clear(){inp.classList.remove('ok','bad');setStatus(el,'');}
  inp.addEventListener('input',clear);
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check'){if(!inp.value.trim()){toast(T('notDone'),'info');return;}var ok=answers.some(function(x){return outNorm(x)===outNorm(inp.value);});inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);result(el,ctx,ok?1:0,1,!scored);scored=true;}
    if(a==='show'){inp.value=String(answers[0]==null?'':answers[0]);inp.classList.remove('bad');inp.classList.add('ok');setStatus(el,T('shown'),'ok');}
    if(a==='reset'){inp.value='';clear();scored=false;}
  });

};

/* 52. Допиши код: в code пропуски [[...]] */
TPL.codefill=function(d,el,ctx){

/* 53. Собери код из строк: lines в ПРАВИЛЬНОМ порядке, отступы сохраняются */
TPL.parsons=function(d,el,ctx){
  el.classList.add('game');
  var lines=(d.lines||[]).map(function(l){return String(l).replace(/\t/g,'    ');}), py=(d.language||'python')==='python', scored=false;
  el.innerHTML=head('parsons','list',true,hint('hintParsons'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+'<div class="ord"></div>'+foot();
  var list=$('.ord',el);
  function fill(){list.innerHTML=perm(lines.length).map(function(i){return '<div class="ord-item code" data-i="'+i+'"><span class="n"></span><span>'+(py?hlPy(lines[i]):esc(lines[i]))+'</span>'+icon('grip','grip')+'</div>';}).join('');num();}
  function num(){$$('.ord-item',list).forEach(function(c,i){$('.n',c).textContent=i+1;});}
  function same(a,b){return lines[+a.dataset.i]===lines[b];}
  function clearMarks(){$$('.ord-item',list).forEach(function(c){c.classList.remove('ok','bad');});setStatus(el,'');}
  pickPlace(el,{chip:'.ord-item',target:'.ord-item',swap:true,place:function(a,b){flip(list,function(){swapEl(a,b);});num();clearMarks();sound('tick');}});
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check'){var cs=$$('.ord-item',list),ok=0;cs.forEach(function(c,i){var g=same(c,i);c.classList.toggle('ok',g);c.classList.toggle('bad',!g);if(g)ok++;});result(el,ctx,ok,cs.length,!scored);scored=true;}
    if(a==='show'){flip(list,function(){$$('.ord-item',list).sort(function(x,y){return x.dataset.i-y.dataset.i;}).forEach(function(c){list.appendChild(c);});});num();$$('.ord-item',list).forEach(function(c){c.classList.remove('bad');c.classList.add('ok');});setStatus(el,T('shown'),'ok');}
    if(a==='reset'){fill();clearMarks();scored=false;}
  });
  fill();
  return {};
};

/* 54. Пошагово: задача разбита на шаги, следующий открывается после верного ответа */
TPL.steps=function(d,el,ctx){
  el.classList.add('game');
  var st=d.steps||[], cur=0, firstTry=0, tries=0, done=false;
  el.innerHTML=head('steps','checks',true,hint('hintSteps'))+(d.title?'<h2 class="s-title">'+fmt(d.title)+'</h2>':'')+(d.task?'<p class="f-lead">'+fmt(d.task)+'</p>':'')+
    '<div class="st-wrap'+(d.code?'':' nocode')+'">'+(d.code?'<div class="cd-code">'+codeLines(d.code,d.language)+'</div>':'')+
    '<div class="st-list">'+st.map(function(s,i){return '<div class="stp" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="q">'+fmt(s.q)+'</span><input autocomplete="off" spellcheck="false" aria-label="'+esc(T('question'))+' '+(i+1)+'"></div>';}).join('')+'</div></div>'+foot();
  var rows=$$('.stp',el);
  function ok(i,v){return [].concat(st[i].answer).some(function(a){var n=toNum(a),m=toNum(v);return n!==null&&m!==null?Math.abs(n-m)<1e-9:norm(a)===norm(v);});}
  function upd(){rows.forEach(function(r,i){var inp=$('input',r);r.classList.toggle('cur',i===cur&&!done);r.classList.toggle('lock',i>cur);inp.disabled=i!==cur||done;});var c=rows[cur];if(c&&!done)setTimeout(function(){try{$('input',c).focus();}catch(e){}},50);}
  function check(){
    if(done)return; var r=rows[cur], v=$('input',r).value;
    if(!v.trim()){toast(T('notDone'),'info');return;}
    if(ok(cur,v)){r.classList.remove('bad');r.classList.add('ok');$('.n',r).innerHTML=icon('check');sound('ok');if(tries===0)firstTry++;tries=0;cur++;
      if(cur>=st.length){done=true;result(el,ctx,firstTry,st.length,true);} else toast(T('stepOk'),'ok');}
    else{tries++;r.classList.remove('bad');void r.offsetWidth;r.classList.add('bad');sound('bad');}
    upd();
  }
  el.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.closest('.stp input')){e.preventDefault();check();}});
  el.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='check')check();
    if(a==='show'){rows.forEach(function(r,i){$('input',r).value=String([].concat(st[i].answer)[0]);r.classList.add('ok');r.classList.remove('bad');});done=true;cur=st.length;setStatus(el,T('shown'),'ok');upd();}
    if(a==='reset'){rows.forEach(function(r,i){$('input',r).value='';r.classList.remove('ok','bad');$('.n',r).textContent=i+1;});cur=0;firstTry=0;tries=0;done=false;setStatus(el,'');upd();}
  });
  upd();
  return {enter:upd};
};

/* ================= engine ================= */
function build(){
  stage.innerHTML=''; S.els=[]; S.inst=[];
  (S.deck.slides||[]).forEach(function(d,i){
    var el=document.createElement('section'); el.className='slide tpl-'+String(d.type||'x').replace(/[^\w-]/g,'');
    stage.appendChild(el);
    var inst={}, fn=TPL[d.type];
    try{ if(fn)inst=fn(d,el,mkCtx(i))||{}; else el.innerHTML='<div class="err">'+esc(T('unknown'))+': '+esc(d.type)+'</div>'; }
    catch(err){ console.error(err); el.innerHTML='<div class="err">'+esc(T('unknown'))+': '+esc(d.type)+'</div>'; inst={}; }
    S.els.push(el); S.inst.push(inst);
  });
  toastEl=document.createElement('div'); toastEl.className='toast'; stage.appendChild(toastEl);
  S.idx=Math.max(0,Math.min(S.idx,S.els.length-1));
  document.body.classList.add('no-anim');
  S.els.forEach(function(el,k){el.classList.toggle('active',k===S.idx);el.classList.toggle('before',k<S.idx);});
  requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.remove('no-anim');});});
  var cur=S.inst[S.idx]; if(cur&&cur.enter)cur.enter();
  document.documentElement.lang=S.lang;
  updBar(); renderTeams();
}
function go(i){
  i=Math.max(0,Math.min(i,S.els.length-1)); if(i===S.idx)return;
  var o=S.inst[S.idx]; if(o&&o.leave)o.leave();
  S.idx=i;
  S.els.forEach(function(el,k){el.classList.toggle('active',k===i);el.classList.toggle('before',k<i);});
  var n=S.inst[i]; if(n&&n.enter)requestAnimationFrame(function(){n.enter();});
  updBar();
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
  post({type:'slide',index:i,total:S.els.length});
}
function next(){var c=S.inst[S.idx];if(c&&c.next&&c.next())return;go(S.idx+1);}
function prev(){go(S.idx-1);}
function layoutAll(){S.inst.forEach(function(x){if(x&&x.layout)x.layout();});}
function fit(){var bh=$('#bar').offsetHeight;$('#viewport').style.bottom=bh+'px';var vh=window.innerHeight-bh;S.scale=Math.min(window.innerWidth/W,vh/H);stage.style.transform='translate(-50%,-50%) scale('+S.scale+')';}
function full(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
function setTheme(t){if(!THEMES[t])t='blue';S.theme=t;document.documentElement.setAttribute('data-theme',t);$$('.th-sw').forEach(function(x){x.classList.toggle('on',x.dataset.t===t);});post({type:'theme',theme:t});}
function setLang(l){if(!I18N[l])return;S.lang=l;$('#bLang').value=l;build();post({type:'lang',lang:l});}

function buildBar(){
  $('#bar').innerHTML='<div id="pbar"></div><div class="b-l" id="teams"></div>'+
    '<div class="b-c"><button class="ib" id="bPrev">'+icon('left')+'</button><span class="count" id="bCount"></span><button class="ib" id="bNext">'+icon('right')+'</button></div>'+
    '<div class="b-r"><button class="ib" id="bTeams">'+icon('users')+'</button><button class="ib" id="bSound"></button>'+
    '<button class="ib" id="bTheme">'+icon('palette')+'</button><label class="lang">'+icon('globe')+'<select id="bLang">'+Object.keys(LANGS).map(function(l){return '<option value="'+l+'">'+LANGS[l]+'</option>';}).join('')+'</select></label>'+
    '<button class="ib" id="bFull">'+icon('max')+'</button></div><div class="th-pop" hidden>'+Object.keys(THEMES).map(function(t){return '<button class="th-sw" data-t="'+t+'" style="background:'+THEMES[t]+'"></button>';}).join('')+'</div>';
  $('#bPrev').onclick=prev; $('#bNext').onclick=next; $('#bFull').onclick=full;
  $('#bTeams').onclick=function(){S.teamsOn=!S.teamsOn;renderTeams();updBar();fit();layoutAll();};
  $('#bSound').onclick=function(){S.sound=!S.sound;updBar();};
  $('#bLang').onchange=function(e){setLang(e.target.value);};
  $('#bTheme').onclick=function(e){e.stopPropagation();var p=$('.th-pop');p.hidden=!p.hidden;};
  $('.th-pop').addEventListener('click',function(e){var b=e.target.closest('.th-sw');if(b){setTheme(b.dataset.t);$('.th-pop').hidden=true;}});
  document.addEventListener('click',function(e){if(!e.target.closest('.th-pop,#bTheme')){var p=$('.th-pop');if(p)p.hidden=true;}});
  $('#teams').addEventListener('click',function(e){
    var t=e.target.closest('.team');if(!t)return;var k=+t.dataset.k,pm=e.target.closest('.pm');
    if(pm){S.teams[k]=Math.max(0,S.teams[k]+(+pm.dataset.d));}else S.active=k;
    renderTeams(!!pm&&pm.dataset.d>0);
  });
}
function renderTeams(bump){
  var box=$('#teams'); if(!box)return;
  if(!S.teamsOn){box.innerHTML='';return;}
  box.innerHTML=S.teams.map(function(s,k){return '<div class="team'+(k===S.active?' active':'')+(bump&&k===S.active?' bump':'')+'" data-k="'+k+'"><span class="tn">'+esc(T('teamN',{n:k+1}))+'</span><span class="tns">'+(k+1)+'</span><button class="pm" data-d="-1">−</button><span class="sc">'+s+'</span><button class="pm" data-d="1">+</button></div>';}).join('');
}
function updBar(){
  var n=S.els.length;
  $('#bCount').textContent=(n?S.idx+1:0)+' / '+n;
  $('#pbar').style.width=(n?((S.idx+1)/n*100):0)+'%';
  $('#bPrev').disabled=S.idx<=0; $('#bNext').disabled=S.idx>=n-1;
  $('#bSound').innerHTML=icon(S.sound?'vol':'mute');
  $('#bTeams').classList.toggle('on',S.teamsOn);
  $('#bPrev').title=T('prev'); $('#bNext').title=T('next'); $('#bTeams').title=T('teams');
  $('#bSound').title=T('sound'); $('#bFull').title=T('fullscreen'); $('#bTheme').title=T('theme');
}
function load(deck,lang){
  S.deck=deck&&deck.slides?deck:{slides:[]};
  var l=lang||S.deck.lang||'ru'; S.lang=I18N[l]?l:'ru';
  var qt=null; try{qt=new URLSearchParams(location.search).get('theme');}catch(e){} setTheme(qt||S.deck.theme||'blue');
  $('#bLang').value=S.lang; build();
}

function init(){
  stage=$('#stage'); buildBar();
  var deck; try{deck=JSON.parse($('#deck').textContent);}catch(e){deck={slides:[]};}
  var h=parseInt((location.hash||'').slice(1),10); if(h>0)S.idx=h-1;
  var ql=null; try{ql=new URLSearchParams(location.search).get('lang');}catch(e){}
  var qd=null; try{qd=new URLSearchParams(location.search).get('deck');}catch(e){}
  if(qd){fetch(qd).then(function(r){return r.json();}).then(function(dk){load(dk,ql);fit();layoutAll();}).catch(function(e){console.error('deck',e);load(deck,ql);});}
  else load(deck,ql);
  fit();
  window.addEventListener('resize',function(){fit();layoutAll();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutAll);
  window.addEventListener('keydown',function(e){
    if(e.target&&e.target.closest&&e.target.closest('input,select,textarea'))return;
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home')go(0); else if(k==='End')go(S.els.length-1);
    else if(k==='f'||k==='F')full();
  });
  window.addEventListener('message',function(e){
    var m=e.data; if(!m||m.source!=='alaqai')return;
    if(m.type==='deck'){S.idx=m.index||0;load(m.deck,m.lang);}
    else if(m.type==='goto')go(+m.index||0);
    else if(m.type==='next')next(); else if(m.type==='prev')prev();
    else if(m.type==='lang')setLang(m.lang);
    else if(m.type==='theme')setTheme(m.theme);
  });
  try{if(window.speechSynthesis)speechSynthesis.getVoices();}catch(e){}
  post({type:'ready',templates:Object.keys(TPL)});
}

/* Публичный API для платформы (если файл открыт с того же домена) */
window.AlaqaiSlides={
  load:function(deck,lang){S.idx=0;load(deck,lang);},
  go:go, next:next, prev:prev, setLang:setLang, setTheme:setTheme,
  register:function(type,fn){TPL[type]=fn;},
  templates:function(){return Object.keys(TPL);},
  util:{fmt:fmt,tex:tex,esc:esc,T:T,icon:icon,shuffle:shuffle,pickPlace:pickPlace}
};

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
